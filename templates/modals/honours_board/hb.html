<!-- =========================================================
     HONOURS BOARD CARD - Ultra-Premium Modern Redesign
========================================================= -->

<div class="hb-card" id="honoursCard">

  <!-- HEADER -->
  <div class="hb-header">
    <div class="hb-header-title">
      <div class="hb-header-icon-wrap">
        <i class="fa-solid fa-trophy hb-trophy-icon"></i>
      </div>
      <div class="hb-header-text">
        <span class="hb-title">Appreciation Wall</span>
        <span class="hb-subtitle">Hall of Fame & Citations</span>
      </div>
    </div>

    <div class="hb-header-actions">
      <div class="hb-counter" id="hbCounter">
        <span class="curr">01</span><span class="sep">/</span><span class="total">07</span>
      </div>
      <div class="hb-nav-btns">
        <button class="hb-nav-btn" id="prevBtn" type="button" title="Previous Citation" aria-label="Previous">
          <i class="fas fa-chevron-left"></i>
        </button>
        <button class="hb-nav-btn" id="nextBtn" type="button" title="Next Citation" aria-label="Next">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- PROGRESS TIMER BAR -->
  <div class="hb-progress-container">
    <div class="hb-progress-bar" id="hbProgressBar"></div>
  </div>

  <!-- CONTENT VIEWPORT -->
  <div class="hb-viewport" id="hbViewport">
    <div class="hb-track" id="hbTrack">
      <div class="hb-loading">
        <div class="hb-spinner"></div>
        <span>Loading appreciation citations...</span>
      </div>
    </div>
  </div>

</div>

<!-- =========================================================

========================================================= -->

  .hb-header-text {

  .hb-header-actions {

    align-items: center;
    gap: 12px;

  .hb-counter {

    font-weight: 700;

    border-radius: 12px;
    background: var(--nav-link-hover-bg, rgba(0, 0, 0, 0.04));
    border: 1px solid var(--border-color, rgba(0, 0, 0, 0.08));
    color: var(--text-primary, #1e293b);

  .hb-counter .curr { color: var(--primary-color, #f59e0b); font-weight: 800; }

  .hb-nav-btn {

  .hb-progress-container {

    border-radius: 0 2px 2px 0;

  .hb-track {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 220px;
  }

  .hb-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    visibility: hidden;
    transform: translateX(30px) scale(0.98);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;

    pointer-events: none;
    z-index: 1;

    opacity: 1;
    visibility: visible;
    transform: translateX(0) scale(1);
    pointer-events: auto;
    z-index: 2;
  }

  .hb-slide.prev-slide {
    opacity: 0;
    visibility: hidden;
    transform: translateX(-30px) scale(0.98);
  }

    function getCategoryClass(type) {
      const lower = (type || "").toLowerCase();
      if (lower.includes("lead")) return "hb-cat-leadership";
      if (lower.includes("excel")) return "hb-cat-excellence";
      if (lower.includes("serv")) return "hb-cat-service";
      if (lower.includes("innov")) return "hb-cat-innovation";
      if (lower.includes("disc")) return "hb-cat-discipline";
      if (lower.includes("team")) return "hb-cat-teamwork";
      return "hb-cat-leadership";
    }

    function getCategoryIcon(type) {
      const lower = (type || "").toLowerCase();
      if (lower.includes("lead")) return "fa-crown";
      if (lower.includes("excel")) return "fa-trophy";
      if (lower.includes("serv")) return "fa-award";
      if (lower.includes("innov")) return "fa-lightbulb";
      if (lower.includes("disc")) return "fa-shield-halved";
      if (lower.includes("team")) return "fa-users-gear";
      return "fa-star";
    }

    function renderAllSlides() {
      if (!track) return;
      if (entries.length === 0) {
        track.innerHTML = `<div class="hb-loading"><span>No appreciation entries found.</span></div>`;
        if (dotsWrap) dotsWrap.innerHTML = "";
        return;
      }

      let slidesHTML = "";
      entries.forEach((item, index) => {
        const initials = item.name
          ? item.name.split(" ").map(w => w[0]).join("").substring(0, 2).toUpperCase()
          : "NA";

        const imageHTML = item.image
          ? `<img src="${item.image}" class="hb-avatar-img" alt="${item.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
             <div class="hb-avatar-fallback" style="display:none;">${initials}</div>`
          : `<div class="hb-avatar-fallback">${initials}</div>`;

        const catClass = getCategoryClass(item.appreciation_type);
        const catIcon = getCategoryIcon(item.appreciation_type);
        const medalIcon = item.medal_icon || ("fa-solid " + catIcon);
        const displayDate = item.appreciation_date || "Official Citation";

        const userRole = "{{ role if role else '' }}".toLowerCase();
        const canManageHonours = ['jco it', 'jcoit', 'nco it', 'onco', 'co', '2ic'].includes(userRole);
        const deleteBtnHTML = (canManageHonours && item.id) ? `
          <button type="button" class="hb-delete-btn" data-id="${item.id}" data-name="${item.name || 'this personnel'}" title="Delete Entry">
            <i class="fas fa-trash-alt"></i>
          </button>
        ` : '';

        slidesHTML += `
          <div class="hb-slide" data-slide-index="${index}">

            <!-- HERO PERSONNEL BANNER -->
            <div class="hb-hero-box">
              <i class="fa-solid fa-award hb-hero-watermark"></i>
              <div class="hb-hero-left">
                <div class="hb-avatar-ring">
                  <div class="hb-avatar-inner">
                    ${imageHTML}
                  </div>
                </div>
                <div class="hb-person-info">
                  <div class="hb-person-name">
                    ${item.rank ? `<span class="hb-rank-pill">${item.rank}</span>` : ''}
                    <span>${item.name || "Personnel"}</span>
                  </div>
                  <div class="hb-tags-row">
                    ${item.company ? `<span class="hb-tag"><i class="fa-solid fa-building-user"></i> ${item.company}</span>` : ''}
                    ${item.army_number ? `<span class="hb-tag"><i class="fa-solid fa-id-badge"></i> ${item.army_number}</span>` : ''}
                  </div>
                </div>
              </div>
            </div>

            <!-- COMMENDATION CITATION CARD -->
            <div class="hb-citation-card">
              <div class="hb-quote-watermark">“</div>
              <div class="hb-citation-text">
                ${item.commendation || "No commendation text provided."}
              </div>
            </div>

            <!-- DELETE BUTTON IN BOTTOM RIGHT CORNER -->
            ${deleteBtnHTML ? deleteBtnHTML : ''}

          </div>
        `;
      });

      track.innerHTML = slidesHTML;

      // Bind delete handlers
      track.querySelectorAll('.hb-delete-btn').forEach(btn => {
        btn.addEventListener('click', async function(e) {
          e.stopPropagation();
          const entryId = this.dataset.id;
          const personName = this.dataset.name;
          if (!confirm(`Are you sure you want to delete the honour entry for ${personName}?`)) return;

          try {
            let res = await fetch(`/stats/delete_honours_entry/${entryId}`, { method: 'DELETE' });
            if (res.status === 404) {
              res = await fetch(`/api/delete-honours-entry/${entryId}`, { method: 'DELETE' });
            }
            const data = await res.json();
            if (data.status === 'success' || data.success) {
              await loadHonoursBoard();
            } else {
              alert(data.message || 'Failed to delete honour entry.');
            }
          } catch (err) {
            alert('Error deleting honour entry.');
          }
        });
      });

      if (dotsWrap) {
        dotsWrap.innerHTML = entries.map((_, i) => `
          <div class="hb-dot ${i === 0 ? 'active' : ''}" data-index="${i}"></div>
        `).join("");
      }

      goHonours(0);
    }

    function goHonours(index) {
      if (entries.length === 0) return;

      const slides = track.querySelectorAll(".hb-slide");
      if (slides.length === 0) return;

      slides[current].classList.remove("active");
      slides[current].classList.add("prev-slide");

      current = ((index % entries.length) + entries.length) % entries.length;

      slides.forEach((slide, idx) => {
        if (idx === current) {
          slide.classList.remove("prev-slide");
          slide.classList.add("active");
        } else {
          slide.classList.remove("active");
        }
      });

      // Update counter
      if (counterEl) {
        const cNum = String(current + 1).padStart(2, '0');
        const tNum = String(entries.length).padStart(2, '0');
        counterEl.innerHTML = `<span class="curr">${cNum}</span><span class="sep">/</span><span class="total">${tNum}</span>`;
      }

      // Update dots
      const dots = dotsWrap ? dotsWrap.querySelectorAll(".hb-dot") : [];
      dots.forEach((dot, idx) => {
        dot.classList.toggle("active", idx === current);
      });

      resetProgress();
    }

    function resetProgress() {
      progressVal = 0;
      if (progressBar) progressBar.style.width = "0%";
    }

    function startAutoScroll() {
      stopAutoScroll();
      resetProgress();

      const stepTime = 100;
      const stepInc = (stepTime / DURATION) * 100;

      progressTimer = setInterval(() => {
        progressVal += stepInc;
        if (progressBar) progressBar.style.width = Math.min(progressVal, 100) + "%";
        if (progressVal >= 100) {
          goHonours(current + 1);
        }
      }, stepTime);
    }

    function stopAutoScroll() {
      if (progressTimer) {
        clearInterval(progressTimer);
        progressTimer = null;
      }
    }

    window.openHonoursBoard = function () {
      if (honoursCard) {
        honoursCard.scrollIntoView({ behavior: "smooth", block: "center" });
        honoursCard.style.boxShadow = "0 0 25px var(--primary-color, #f59e0b)";
        setTimeout(() => {
          honoursCard.style.boxShadow = "";
        }, 2000);
      }
    };

    // Listen to global theme changes
    window.addEventListener("themechange", () => {
      resetProgress();
    });

    document.addEventListener("DOMContentLoaded", async function () {
      await loadHonoursBoard();
      renderAllSlides();
      startAutoScroll();

      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          goHonours(current + 1);
          startAutoScroll();
        });
      }

      if (prevBtn) {
        prevBtn.addEventListener("click", () => {
          goHonours(current - 1);
          startAutoScroll();
        });
      }

      if (dotsWrap) {
        dotsWrap.addEventListener("click", (e) => {
          const dot = e.target.closest(".hb-dot");
          if (!dot) return;
          goHonours(Number(dot.dataset.index));
          startAutoScroll();
        });
      }

      if (honoursCard) {
        honoursCard.addEventListener("mouseenter", stopAutoScroll);
        honoursCard.addEventListener("mouseleave", startAutoScroll);
      }
    });

    document.addEventListener("keydown", (e) => {
      if (!honoursCard) return;
      const rect = honoursCard.getBoundingClientRect();
      if (rect.top > window.innerHeight || rect.bottom < 0) return;
      if (e.key === "ArrowRight") {
        goHonours(current + 1);
        startAutoScroll();
      }
      if (e.key === "ArrowLeft") {
        goHonours(current - 1);
        startAutoScroll();
      }
    });
  })();
</script>
