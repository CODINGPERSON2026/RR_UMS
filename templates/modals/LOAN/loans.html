<!-- ================== LOAN GRAPH MODAL ================== -->
<div class="modal fade" id="loanModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-fullscreen-custom">
    <div class="modal-content border-0 shadow">

      <div class="modal-header bg-primary text-white d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-3">
          <h5 class="modal-title fw-bold mb-0"><i class="fas fa-hand-holding-usd me-2"></i>Loan Distribution (Amount-Wise)</h5>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-light btn-sm fw-bold text-primary" onclick="openAllLoansTable()">
            <i class="fas fa-list me-1"></i>View All Details
          </button>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
      </div>

      <div class="modal-body d-flex align-items-center justify-content-center p-3">
        <canvas id="loanDonutChart" style="max-height: 75vh; width: 100%;"></canvas>
      </div>

    </div>
  </div>
</div>

<!-- ================== LOAN TABLE MODAL ================== -->
<div class="modal fade" id="loanTableModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-fullscreen-custom">
    <div class="modal-content border-0 shadow">

      <div class="modal-header bg-dark text-white d-flex align-items-center justify-content-between">
        <h5 class="modal-title fw-bold mb-0" id="loanTableTitle">Loan Details (Amount-Wise)</h5>
        <div class="d-flex align-items-center gap-3">
          <select id="loanRangeFilterSelect" class="form-select form-select-sm" style="width: auto;" onchange="onLoanRangeFilterChange(this.value)">
            <option value="all">All Loan Amounts</option>
            <option value="0_5">0–5 Lakh</option>
            <option value="6_10">6–10 Lakh</option>
            <option value="11_15">11–15 Lakh</option>
            <option value="16_20">16–20 Lakh</option>
            <option value="20_plus">&gt; 20 Lakh</option>
          </select>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
      </div>

      <div class="modal-body p-0">
        <div class="loan-table-scroll">
          <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-light sticky-top">
              <tr>
                <th>Army No</th>
                <th>Rank</th>
                <th>Name</th>
                <th>Company</th>
                <th>Loan Type</th>
                <th>Total Amount</th>
                <th>Pending</th>
                <th>EMI</th>
              </tr>
            </thead>
            <tbody id="loanTableBodyPopup">
              <tr>
                <td colspan="8" class="text-center text-muted py-4">Loading...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- ================== STYLES ================== -->
<style>
  .modal-fullscreen-custom {
    width: 95vw !important;
    max-width: 95vw !important;
    height: 95vh;
    margin: auto;
  }

  .modal-fullscreen-custom .modal-content {
    height: 95vh;
    border-radius: 8px;
  }

  .modal-fullscreen-custom .modal-header {
    position: sticky;
    top: 0;
    z-index: 1055;
  }

  .modal-fullscreen-custom .modal-body {
    height: calc(95vh - 64px);
  }

  .loan-table-scroll {
    height: 100%;
    overflow-y: auto;
  }

  .loan-table-scroll th,
  .loan-table-scroll td {
    padding: 12px;
    font-size: 0.95rem;
  }

  .table-hover tbody tr:hover {
    background-color: #f1f5f9;
  }
</style>

<!-- ================== SCRIPT ================== -->
<script>
  var loanChart;

  /* Load chart when modal opens */
  document.getElementById('loanModal')?.addEventListener('shown.bs.modal', loadLoanChart);

  function loadLoanChart() {
    fetch('/loan_details/summary')
      .then(res => res.json())
      .then(data => {

        const ctx = document.getElementById('loanDonutChart');
        if (loanChart) loanChart.destroy();

        const barDatalabelsPlugin = {
          id: 'barDatalabels',
          afterDatasetsDraw(chart) {
            const { ctx } = chart;
            chart.data.datasets.forEach((ds, i) => {
              const meta = chart.getDatasetMeta(i);
              if (meta.hidden) return;
              meta.data.forEach((bar, idx) => {
                const val = ds.data[idx];
                if (val == null || val === 0) return;
                ctx.save();
                ctx.font = 'bold 12px sans-serif';
                const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
                ctx.fillStyle = isDark ? '#cbd5e1' : '#1e293b';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText(val + ' personnel', bar.x, bar.y - 5);
                ctx.restore();
              });
            });
          }
        };

        loanChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: [
              '0–5 Lakh',
              '6–10 Lakh',
              '11–15 Lakh',
              '16–20 Lakh',
              '> 20 Lakh'
            ],
            datasets: [{
              label: 'Number of Personnel',
              data: [
                data.l0_5 || 0,
                data.l6_10 || 0,
                data.l11_15 || 0,
                data.l16_20 || 0,
                data.l20_plus || 0
              ],
              backgroundColor: [
                '#3b82f6',
                '#06b6d4',
                '#f59e0b',
                '#8b5cf6',
                '#ef4444'
              ]
            }]
          },
          plugins: [barDatalabelsPlugin],
          options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: { top: 25 } },
            plugins: {
              legend: { display: false },
              title: {
                display: true,
                text: 'Click on any amount range bar to view personnel details',
                font: { size: 14, weight: 'bold' }
              }
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { stepSize: 1 }
              }
            },
            onClick: (evt, elements) => {
              if (!elements.length) return;

              const index = elements[0].index;
              const rangeMap = ['0_5', '6_10', '11_15', '16_20', '20_plus'];
              const labelMap = [
                '0–5 Lakh',
                '6–10 Lakh',
                '11–15 Lakh',
                '16–20 Lakh',
                '> 20 Lakh'
              ];

              loadLoanTablePopup(rangeMap[index], labelMap[index]);
            }
          }
        });
      });
  }

  function openAllLoansTable() {
    loadLoanTablePopup('all', 'All Loan Amounts');
  }

  function onLoanRangeFilterChange(rangeKey) {
    const labelMap = {
      'all': 'All Loan Amounts',
      '0_5': '0–5 Lakh',
      '6_10': '6–10 Lakh',
      '11_15': '11–15 Lakh',
      '16_20': '16–20 Lakh',
      '20_plus': '> 20 Lakh'
    };
    loadLoanTablePopup(rangeKey, labelMap[rangeKey] || 'Loan Details');
  }

  function loadLoanTablePopup(rangeKey, label) {
    document.getElementById('loanTableTitle').innerText = `Loan Details (${label})`;
    const selectEl = document.getElementById('loanRangeFilterSelect');
    if (selectEl) selectEl.value = rangeKey;

    const tbody = document.getElementById('loanTableBodyPopup');
    tbody.innerHTML = `
    <tr>
      <td colspan="8" class="text-center text-muted py-4">Loading...</td>
    </tr>
  `;

    const loanModalEl = document.getElementById('loanModal');
    const loanModalInstance = bootstrap.Modal.getInstance(loanModalEl);

    if (loanModalInstance) loanModalInstance.hide();

    const openTableModal = () => {
      let tableModalEl = document.getElementById('loanTableModal');
      let tableModalInstance = bootstrap.Modal.getInstance(tableModalEl);
      if (!tableModalInstance) {
        tableModalInstance = new bootstrap.Modal(tableModalEl);
      }
      tableModalInstance.show();
    };

    if (loanModalEl && loanModalEl.classList.contains('show')) {
      loanModalEl.addEventListener('hidden.bs.modal', openTableModal, { once: true });
    } else {
      openTableModal();
    }

    fetch(`/loan_details/by-range/${rangeKey}`)
      .then(res => res.json())
      .then(rows => {
        tbody.innerHTML = '';

        if (!rows || !rows.length) {
          tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center text-muted py-4">No personnel found for this loan range</td>
          </tr>
        `;
          return;
        }

        const formatMoney = val => {
          if (val == null || val === '') return '₹ 0';
          const n = Number(val);
          return isNaN(n) ? val : '₹ ' + n.toLocaleString('en-IN');
        };

        rows.forEach(r => {
          tbody.innerHTML += `
          <tr>
            <td><strong>${r.army_number || '-'}</strong></td>
            <td>${r.rank || '-'}</td>
            <td class="fw-semibold">${r.name || '-'}</td>
            <td><span class="badge bg-light text-dark border">${r.company_name || '-'}</span></td>
            <td>${r.loan_type || '-'}</td>
            <td class="text-end fw-bold text-primary">${formatMoney(r.total_amount)}</td>
            <td class="text-end fw-bold text-danger">${formatMoney(r.pending)}</td>
            <td class="text-end fw-bold text-success">${formatMoney(r.emi_per_month)}</td>
          </tr>
        `;
        });
      })
      .catch(err => {
        console.error("Error fetching loan data:", err);
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center text-danger py-4">Error loading loan data</td>
          </tr>
        `;
      });
  }
</script>
