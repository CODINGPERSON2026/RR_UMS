<!-- Modal -->
<div class="modal fade" id="personnelModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Assign Personnel</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <!-- Company & Search Row -->
        <div class="row g-2 mb-3">
          <div class="col-md-5">
            <label class="form-label mb-1" style="font-size: 13px; font-weight: 600;">Filter by Company</label>
            <select id="personalCoyFilter" class="form-select">
              <option value="">All Companies</option>
              <option value="A COY">A COY</option>
              <option value="B COY">B COY</option>
              <option value="C COY">C COY</option>
              <option value="D COY">D COY</option>
              <option value="E COY">E COY</option>
              <option value="F COY">F COY</option>
              <option value="HQ COY">HQ COY</option>
            </select>
          </div>
          <div class="col-md-7">
            <label class="form-label mb-1" style="font-size: 13px; font-weight: 600;">Search Army Number / Name</label>
            <div class="d-flex">
              <input type="text" id="searchInput" class="form-control me-2" placeholder="Enter army number">
              <button class="btn btn-success" id="searchBtn" type="button"><i class="fas fa-search me-1"></i>Search</button>
            </div>
          </div>
        </div>

        <p id="warningMessage" style="font-weight:bold;font-size:16px;"></p>

        <!-- Action Selector -->
        <div class="mb-3">
          <label class="form-label">Select Action</label>
          <select id="actionType" class="form-select">
            <option value="">-- Select Action --</option>
            <option value="det">Detachment</option>
            <option value="posting">Posting</option>
            <option value="TD">Attachment</option>
            <option value="any_other">Any Other</option>
          </select>
        </div>

        <!-- Location Dropdown -->
        <div class="mb-3" id="locationBox" style="display: none;">
          <label class="form-label">Select Location</label>
          <select id="locationDropdown" class="form-select"></select>
        </div>
        <!-- Posting Input Field -->
<div class="mb-3" id="postingInputBox" style="display:none;">
    <label class="form-label">Enter Posting Location</label>
    <input type="text" id="postingInput" class="form-control" placeholder="Enter Posting Location">
  </div>
  

        <!-- TD / Any Other -->
        <div class="mb-3" id="remarksBox" style="display:none;">

          <!-- TD -->
          <div id="tdFields" style="display:none;">
            <label class="form-label">TD Location</label>
            <input type="text" id="tdLocation" class="form-control mb-2" placeholder="Enter TD Location">

            <label class="form-label">Authority</label>
            <input type="text" id="tdAuthority" class="form-control" placeholder="Enter Authority">
          </div>

          <!-- Any Other -->
          <div id="otherFields" style="display:none;">
            <label class="form-label">Enter Remarks</label>
            <input type="text" id="remarksInput" class="form-control" placeholder="Enter reason...">
          </div>

        </div>

        <!-- Table -->
        <div class="table-responsive">
          <table class="table table-bordered">
            <thead class="table-light">
              <tr>
                <th style="width: 50px;">Select</th>
                <th>Army Number</th>
                <th>Rank</th>
                <th>Name</th>
                <th>Trade</th>
                <th>Coy</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="personnelTableBody">
              <tr><td colspan="7" class="text-center py-4 text-muted"><i class="fas fa-search me-1"></i> Please enter Army Number or Name to search personnel.</td></tr>
            </tbody>
          </table>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-primary" id="assignBtn">Assign Selected</button>
      </div>

    </div>
  </div>
</div>

{% include 'modals/success-modal/modal.html' %}

<script>
var selectedPersonnel = window.selectedPersonnel || new Set();
var dropdown = document.getElementById('locationDropdown');
var actionSelect = document.getElementById('actionType');
var locationBox = document.getElementById('locationBox');
var remarksBox = document.getElementById('remarksBox');
var tdFields = document.getElementById('tdFields');
var otherFields = document.getElementById('otherFields');
var warningMessage = document.getElementById('warningMessage');
var searchInput = document.getElementById('searchInput');
var personnelTableBody = document.getElementById('personnelTableBody');
var assignBtn = document.getElementById('assignBtn');
var postingInputBox = document.getElementById('postingInputBox');
var postingInput = document.getElementById('postingInput');
var personalCoyFilter = document.getElementById('personalCoyFilter');

// ACTION CHANGE
// ACTION CHANGE
actionSelect.addEventListener("change", async function () {
    const action = this.value;

    // Reset all
    dropdown.innerHTML = "";
    locationBox.style.display = "none";
    postingInputBox.style.display = "none";
    remarksBox.style.display = "none";
    tdFields.style.display = "none";
    otherFields.style.display = "none";

    if (action === "posting") {

        // ✅ Show input field instead of dropdown
        postingInputBox.style.display = "block";

    } else if (action === "det") {

        locationBox.style.display = "block";

        try {
            const res = await fetch('/get_locations');

            if (res.status === 401) {
                warningMessage.innerText = "Please login again";
                warningMessage.style.color = "red";
                dropdown.innerHTML = '<option value="">Error loading locations</option>';
                return;
            }

            const locations = await res.json();

            if (locations.error) {
                warningMessage.innerText = locations.error;
                warningMessage.style.color = "red";
                dropdown.innerHTML = '<option value="">Error loading locations</option>';
            } else {
                dropdown.innerHTML = locations
                    .map(l => `<option value="${l.det_id}">${l.det_name}</option>`)
                    .join('');
            }

        } catch (error) {
            console.error('Error loading locations:', error);
            dropdown.innerHTML = '<option value="">Error loading locations</option>';
        }

    } else if (action === "TD") {
        remarksBox.style.display = "block";
        tdFields.style.display = "block";

    } else if (action === "any_other") {
        remarksBox.style.display = "block";
        otherFields.style.display = "block";
    }
});

// LOAD DETACHMENTS ON MODAL OPEN (DO NOT AUTO-FETCH PERSONNEL)
document.getElementById('personnelModal')?.addEventListener('shown.bs.modal', async () => {
    // Keep locationBox visible only if detachment action is active
    if (locationBox) {
        locationBox.style.display = (actionSelect && actionSelect.value === "det") ? "block" : "none";
    }

    // Set initial prompt to require search criteria
    if (personnelTableBody && (!searchInput || !searchInput.value.trim())) {
        personnelTableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><i class="fas fa-search me-1"></i> Please enter Army Number or Name to search personnel.</td></tr>';
    }

    try {
        const res = await fetch('/get_locations');
        
        if (res.status === 401) {
            warningMessage.innerText = "Please login again";
            warningMessage.style.color = "red";
            dropdown.innerHTML = '<option value="">Error loading locations</option>';
            return;
        }
        
        const locations = await res.json();
        
        if (locations.error) {
            warningMessage.innerText = locations.error;
            warningMessage.style.color = "red";
            dropdown.innerHTML = '<option value="">Error loading locations</option>';
        } else {
            dropdown.innerHTML = '<option value="">-- Select Location --</option>' + (Array.isArray(locations) ? locations
                .map(l => `<option value="${l.det_id}">${l.det_name}</option>`).join('') : '');
        }
    } catch (error) {
        console.error('Error loading locations:', error);
        dropdown.innerHTML = '<option value="">Error loading locations</option>';
    }
});

// CLEAR ON MODAL CLOSE
document.getElementById('personnelModal')?.addEventListener('hidden.bs.modal', () => {
    // Clear all fields
    if (searchInput) searchInput.value = '';
    if (personalCoyFilter) personalCoyFilter.value = '';
    if (actionSelect) actionSelect.value = '';
    if (warningMessage) warningMessage.innerText = '';
    if (personnelTableBody) {
        personnelTableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><i class="fas fa-search me-1"></i> Please enter Army Number or Name to search personnel.</td></tr>';
    }
    selectedPersonnel.clear();
    if (assignBtn) assignBtn.disabled = true;
    
    // Reset visibility (keep locationBox hidden until det action chosen)
    if (locationBox) locationBox.style.display = "none";
    if (postingInputBox) postingInputBox.style.display = "none";
    if (remarksBox) remarksBox.style.display = "none";
    if (tdFields) tdFields.style.display = "none";
    if (otherFields) otherFields.style.display = "none";
    if (tdLocation) tdLocation.value = '';
    if (tdAuthority) tdAuthority.value = '';
    if (remarksInput) remarksInput.value = '';
    if (postingInput) postingInput.value = '';
});

// UNIFIED SEARCH & COMPANY FILTER
async function performPersonnelSearch() {
  const query = searchInput ? searchInput.value.trim() : "";
  const coy = personalCoyFilter ? personalCoyFilter.value.trim() : "";
  if (warningMessage) warningMessage.innerText = "";
  if (assignBtn) assignBtn.disabled = selectedPersonnel.size === 0;

  // Only fetch when army number or name is provided
  if (!query) {
    if (personnelTableBody) {
      personnelTableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><i class="fas fa-search me-1"></i> Please enter Army Number or Name to search personnel.</td></tr>';
    }
    if (warningMessage) {
      warningMessage.innerText = "Please enter Army Number or Name to search";
      warningMessage.style.color = "#dc3545";
    }
    return;
  }

  if (personnelTableBody) {
    personnelTableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>Searching personnel records...</td></tr>';
  }

  try {
      const res = await fetch('/search_personnel', {
          method: 'POST',
          headers: {'Content-Type':'application/x-www-form-urlencoded'},
          body: `army_number=${encodeURIComponent(query)}&company=${encodeURIComponent(coy)}`
      });

      // Handle authentication errors
      if (res.status === 401) {
          warningMessage.innerText = "Please login again";
          warningMessage.style.color = "red";
          if (personnelTableBody) personnelTableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-danger"><i class="fas fa-lock me-1"></i> Authentication required. Please login again.</td></tr>';
          return;
      }

      // Handle forbidden access
      if (res.status === 403) {
          warningMessage.innerText = "Access denied - Personnel not in your company";
          warningMessage.style.color = "red";
          if (personnelTableBody) personnelTableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-danger"><i class="fas fa-ban me-1"></i> Access denied.</td></tr>';
          return;
      }

      const personnel = await res.json();

      // Handle other errors
      if (personnel.error) {
          warningMessage.innerText = personnel.error;
          warningMessage.style.color = "red";
          if (personnelTableBody) personnelTableBody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-danger"><i class="fas fa-exclamation-triangle me-1"></i> ${personnel.error}</td></tr>`;
          return;
      }

      if (!personnel || personnel.length === 0) {
          warningMessage.innerText = "No personnel found matching criteria";
          warningMessage.style.color = "#dc3545";
          if (personnelTableBody) personnelTableBody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted"><i class="fas fa-users-slash me-1"></i> No personnel found matching criteria</td></tr>';
          return;
      }

      // Sort to show selected items first
      personnel.sort((a,b)=>selectedPersonnel.has(b.army_number)-selectedPersonnel.has(a.army_number));
      
      // Clear table
      personnelTableBody.innerHTML = "";

      let availCount = 0;
      // Populate table with status
      personnel.forEach(p => {
        let isAvail = true;
        let badge = '<span class="badge bg-success">Available</span>';
        if (p.leave_status) {
          isAvail = false;
          badge = '<span class="badge bg-warning text-dark">On Leave</span>';
        } else if (p.course_status) {
          isAvail = false;
          badge = '<span class="badge bg-info text-dark">On Course</span>';
        } else if (p.det_status) {
          isAvail = false;
          badge = '<span class="badge bg-primary">On Detachment</span>';
        } else if (p.td_status) {
          isAvail = false;
          badge = '<span class="badge bg-secondary">On TD</span>';
        } else if (p.posting_status) {
          isAvail = false;
          badge = '<span class="badge bg-danger">Posted Out</span>';
        }
        if (isAvail) availCount++;

        personnelTableBody.innerHTML += `
          <tr>
            <td class="text-center">
              <input type="checkbox" class="personnel-checkbox" data-id="${p.army_number}" ${selectedPersonnel.has(p.army_number)?"checked":""}>
            </td>
            <td><strong>${p.army_number}</strong></td>
            <td>${p.rank || ''}</td>
            <td>${p.name || ''}</td>
            <td>${p.trade || ''}</td>
            <td><span class="badge bg-light text-dark border">${p.company || ''}</span></td>
            <td>${badge}</td>
          </tr>`;
      });

      if (personnel.length === 1) {
        const p = personnel[0];
        if (p.det_status) {
          warningMessage.innerText = "Personnel is currently on Detachment (selectable to reassign)";
          warningMessage.style.color = "#0d6efd";
        } else if (p.td_status) {
          warningMessage.innerText = "Personnel is currently on TD (selectable to reassign)";
          warningMessage.style.color = "#0d6efd";
        } else if (p.course_status) {
          warningMessage.innerText = "Personnel is currently on Course";
          warningMessage.style.color = "#e67e22";
        } else if (p.leave_status) {
          warningMessage.innerText = "Personnel is currently on Leave";
          warningMessage.style.color = "#e67e22";
        } else if (p.posting_status) {
          warningMessage.innerText = "Personnel is Posted Out";
          warningMessage.style.color = "#dc3545";
        } else {
          warningMessage.innerText = "Personnel is Available";
          warningMessage.style.color = "green";
        }
      } else {
        warningMessage.innerText = `Showing ${personnel.length} personnel (${availCount} available)`;
        warningMessage.style.color = "#0d6efd";
      }

  } catch (error) {
      console.error('Search error:', error);
      warningMessage.innerText = "Error searching personnel";
      warningMessage.style.color = "red";
  }
}

document.getElementById('searchBtn')?.addEventListener('click', performPersonnelSearch);
personalCoyFilter?.addEventListener('change', performPersonnelSearch);
searchInput?.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    performPersonnelSearch();
  }
});

// CHECKBOX TRACK
document.addEventListener('change', e => {
  if (e.target.classList.contains('personnel-checkbox')) {
      const id = e.target.dataset.id;
      if (e.target.checked) {
          selectedPersonnel.add(id);
      } else {
          selectedPersonnel.delete(id);
      }
      
      // Enable/disable assign button based on selection
      assignBtn.disabled = selectedPersonnel.size === 0;
  }
});

function displayStatusNotice(message, color) {
    if (typeof showStatusModal === 'function') {
        showStatusModal(message, color, 2500);
    } else {
        alert(message);
    }
}

// SUBMIT ASSIGNMENT
assignBtn.addEventListener('click', async () => {
    let remarks = "";
    const action = actionSelect.value;
    const tdLocation = document.getElementById('tdLocation');
    const tdAuthority = document.getElementById('tdAuthority');
    const remarksInput = document.getElementById('remarksInput');

    // Validate action
    if (!action) {
        displayStatusNotice("Please select an action first", "Red");
        return;
    }

    // Validate based on action type
    if (action === "TD") {
        const loc = tdLocation ? tdLocation.value.trim() : '';
        const auth = tdAuthority ? tdAuthority.value.trim() : '';
        if (!loc || !auth) {
            displayStatusNotice("Please enter TD Location and Authority", "Red");
            return;
        }
        remarks = `Location: ${loc}, Authority: ${auth}`;

    } else if (action === "any_other") {
        remarks = remarksInput ? remarksInput.value.trim() : '';
        if (!remarks) {
            displayStatusNotice("Please enter Remarks", "Red");
            return;
        }

    } else if (action === "posting") {
        remarks = postingInput ? postingInput.value.trim() : '';
        if (!remarks) {
            displayStatusNotice("Please enter Posting Location", "Red");
            return;
        }

    } else {
        remarks = dropdown ? dropdown.value : '';
        if (!remarks) {
            displayStatusNotice("Please select a Location", "Red");
            return;
        }
    }

    // Validate selection
    if (selectedPersonnel.size === 0) {
        displayStatusNotice("Please select at least one personnel", "Red");
        return;
    }

    // Disable button to prevent double click
    assignBtn.disabled = true;
    assignBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Assigning...';

    try {
        const res = await fetch('/assign_personnel', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                army_number: [...selectedPersonnel],
                status: action,
                remarks: remarks
            })
        });

        const data = await res.json();

        // Reset button state
        assignBtn.disabled = false;
        assignBtn.innerHTML = 'Assign Selected';

        // Handle responses
        if (res.status === 401) {
            displayStatusNotice("Please login again", "Red");
            return;
        }

        if (res.status === 403 || res.status === 400) {
            displayStatusNotice(`Error: ${data.error || 'Request failed'}`, "Red");
            return;
        }

        if (res.ok) {
            displayStatusNotice(`Personnel ${data.message || 'assigned successfully'}`, "#34a853");
            // Close modal and refresh after delay
            setTimeout(() => {
                const modalEl = document.getElementById('personnelModal');
                if (modalEl && window.bootstrap) {
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) modal.hide();
                }
                location.reload();
            }, 1500);
        } else {
            displayStatusNotice(`Error: ${data.error || 'Unknown error'}`, "#dc3545");
        }

    } catch (error) {
        console.error('Assignment error:', error);
        assignBtn.disabled = false;
        assignBtn.innerHTML = 'Assign Selected';
        displayStatusNotice("Network error. Please try again.", "#dc3545");
    }
});
</script>
