<!-- =========================================================
     TODAY'S SCHEDULE MODAL
========================================================= -->

<style>

    .schedule-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background: var(--card-background);
        margin-bottom: 8px;
        transition: 0.2s ease;
    }
    
    .schedule-item:hover {
        border-color: var(--primary-color);
        transform: translateX(3px);
    }
    
    .schedule-item.active-now-event {
        border-color: #22c55e;
        background: rgba(34, 197, 94, 0.08);
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.15);
    }

    .schedule-item.active-event {
        border-color: var(--primary-color, #2563eb);
        background: rgba(37, 99, 235, 0.06);
    }
    
    .schedule-item.done-event {
        opacity: 0.55;
    }
    
    .schedule-title {
        font-size: 14px;
        font-weight: 700;
        color: var(--text-primary);
    }
    
    .schedule-sub {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
    }
    
    .schedule-right {
        text-align: right;
        flex-shrink: 0;
    }
    
    .schedule-time {
        font-size: 13px;
        font-weight: 700;
        color: var(--primary-color);
    }
    
    .schedule-status {
        font-size: 10px;
        font-weight: 600;
        margin-top: 3px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
    }

    .status-active {
        color: #16a34a;
        font-weight: 700;
    }
    
    .status-done {
        color: #64748b;
    }
    
    .status-next {
        color: var(--primary-color, #2563eb);
        font-weight: 700;
    }
    
    .status-pending {
        color: var(--text-secondary);
    }
    
    .schedule-empty {
        text-align: center;
        padding: 35px 10px;
        color: var(--text-secondary);
    }
    
    .schedule-empty i {
        font-size: 32px;
        margin-bottom: 10px;
        opacity: .5;
    }
    
    </style>
    
    
    <!-- =========================================================
    MODAL
    ========================================================= -->
    
    <div class="modal fade" id="scheduleModal" tabindex="-1">
    
        <div class="modal-dialog modal-dialog-centered">
    
            <div class="modal-content">
    
                <div class="modal-header">
    
                    <h5 class="modal-title">
                        <i class="fa fa-calendar-check-o me-2"></i>
                        Today's Schedule
                    </h5>
    
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal"></button>
    
                </div>
    
                <div class="modal-body" id="scheduleList">
    
                    <!-- JS RENDERS HERE -->
    
                </div>
    
            </div>
    
        </div>
    
    </div>
    
    
    <script>
    
    // =========================================================
    // GLOBAL SCHEDULE STORAGE
    // =========================================================
    
    let schedules = [];
    
    
    // =========================================================
    // FETCH TODAY SCHEDULES
    // =========================================================
    
    async function fetchSchedules() {
    
        try {
    
            const response = await fetch("/api/today/schedules");
    
            schedules = await response.json();
    
            // =============================================
            // UPDATE SMALL CARD
            // =============================================
    
            loadNextEvent();
    
            // =============================================
            // UPDATE MODAL LIST
            // =============================================
    
            renderSchedule();
    
        }
    
        catch (error) {
    
            console.error(
                "Schedule fetch error:",
                error
            );
        }
    }
    
    
    // =========================================================
    // TIME TO MINUTES
    // =========================================================
    
    function getEventMinutes(timeStr) {
    
        if (!timeStr) return 0;
    
        const parts = timeStr.split(":");
    
        const h = parseInt(parts[0]);
    
        const m = parseInt(parts[1]);
    
        return h * 60 + m;
    }
    
    
    // =========================================================
    // FORMAT 24H -> 12H
    // =========================================================
    
    function formatTime24to12(timeStr) {
    
        if (!timeStr) return "--";
    
        let [hour, minute] = timeStr.split(":");
    
        hour = parseInt(hour);
    
        const ampm =
            hour >= 12 ? "PM" : "AM";
    
        hour = hour % 12 || 12;
    
        return `${hour}:${minute} ${ampm}`;
    }
    
    
    // =========================================================
    // UPDATE NEXT EVENT CARD
    // =========================================================
    
    function loadNextEvent() {
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();

        // 1. Check for Active Now (ongoing event: currentMinutes between start & end)
        const activeEvent = schedules.find(event => {
            const startMin = getEventMinutes(event.start_time);
            const endMin = event.end_time ? getEventMinutes(event.end_time) : (startMin + 60);
            return currentMinutes >= startMin && currentMinutes <= endMin;
        });

        // 2. Find Next Upcoming Event (start_time > currentMinutes)
        const nextEvent = schedules.find(event => {
            const startMin = getEventMinutes(event.start_time);
            return startMin > currentMinutes;
        });

        const targetEvent = activeEvent || nextEvent;

        const nextEventTitle = document.getElementById("nextEventTitle");
        if (nextEventTitle) {
            nextEventTitle.innerText = targetEvent
                ? targetEvent.title
                : "All Tasks Completed";
        }

        const nextEventTime = document.getElementById("nextEventTime");
        if (nextEventTime) {
            if (activeEvent) {
                nextEventTime.innerHTML = `<span style="color:#16a34a; font-weight:700;">🟢 Active Now</span>`;
            } else if (nextEvent) {
                nextEventTime.innerText = formatTime24to12(nextEvent.start_time);
            } else {
                nextEventTime.innerText = "--";
            }
        }

        const nextEventDesc = document.getElementById("nextEventDesc");
        if (nextEventDesc) {
            nextEventDesc.innerText = targetEvent
                ? (targetEvent.location || "Location not specified")
                : "No more schedules today";
        }
    }
    
    
    // =========================================================
    // RENDER MODAL SCHEDULE LIST
    // =========================================================
    
    function renderSchedule() {
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        let nextFound = false;

        const container = document.getElementById("scheduleList");
        if (!container) return;

        container.innerHTML = "";

        if (!schedules.length) {
            container.innerHTML = `
                <div class="schedule-empty">
                    <i class="fa fa-calendar-times-o"></i>
                    <div>No schedules for today</div>
                </div>
            `;
            return;
        }

        schedules.forEach(event => {
            const startMin = getEventMinutes(event.start_time);
            const endMin = event.end_time ? getEventMinutes(event.end_time) : (startMin + 60);

            let cls = "";
            let statusCls = "status-pending";
            let statusLabel = "Scheduled";

            // 🟢 1. Active Now (Ongoing)
            if (currentMinutes >= startMin && currentMinutes <= endMin) {
                cls = "active-now-event";
                statusCls = "status-active";
                statusLabel = "🟢 Active Now";
            }
            // 🔵 2. Next / Upcoming
            else if (currentMinutes < startMin) {
                if (!nextFound) {
                    cls = "active-event";
                    statusCls = "status-next";
                    statusLabel = "🔵 Next";
                    nextFound = true;
                } else {
                    cls = "scheduled-event";
                    statusCls = "status-pending";
                    statusLabel = "Scheduled";
                }
            }
            // 3. Completed (Past Event)
            else {
                cls = "done-event";
                statusCls = "status-done";
                statusLabel = "Completed";
            }

            container.innerHTML += `
                <div class="schedule-item ${cls}">
                    <div>
                        <div class="schedule-title">${event.title}</div>
                        <div class="schedule-sub">
                            <i class="fa fa-map-marker" style="font-size:11px; margin-right:4px"></i>
                            ${event.location || "N/A"}
                        </div>
                    </div>
                    <div class="schedule-right">
                        <div class="schedule-time">
                            ${formatTime24to12(event.start_time)} ${event.end_time ? '- ' + formatTime24to12(event.end_time) : ''}
                        </div>
                        <div class="schedule-status ${statusCls}">
                            ${statusLabel}
                        </div>
                    </div>
                </div>
            `;
        });
    }
    
    
    // =========================================================
    // INIT
    // =========================================================
    
    document.addEventListener(
        "DOMContentLoaded",
        function () {
    
            // =============================================
            // FETCH INITIAL DATA
            // =============================================
    
            fetchSchedules();
    
            // =============================================
            // REFRESH STATUS WHEN OPENING MODAL
            // =============================================
    
            document
                .getElementById("scheduleModal")
                .addEventListener(
                    "show.bs.modal",
                    renderSchedule
                );
    
            // =============================================
            // AUTO REFRESH EVERY 60s
            // =============================================
    
            setInterval(() => {
    
                fetchSchedules();
    
            }, 60000);
        }
    );
    
    </script>
