
<style>
  #printParadeBtn:hover{

    background-color: rgb(44, 29, 11);

  }
</style>
<div class="modal fade" id="countModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
  
        <!-- HEADER -->
        <div class="modal-header bg-secondary text-white">
          <h5 class="modal-title fw-bold">PARADE STATE - COUNT UPDATE</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
  
        <!-- BODY -->
        <div class="modal-body">
          <div class="table-responsive">
  
            <table class="table table-bordered table-hover text-center align-middle" id="paradeDisplayTable">
              <thead class="table-dark">
                <tr>
                  <th>Rank / Category</th>
                  <th>COMN Company</th>
                  <th>3 Company</th>
                  <th>HQ company</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody>
                <tr><td colspan="6">Loading...</td></tr>
              </tbody>
            </table>
  
          </div>
        </div>
  
        <!-- FOOTER -->
        <div class="modal-footer">
          <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
          <button id="printParadeBtn" class="btn btn-primary">
            🖨 Print Parade State
          </button>
        </div>
        
      </div>
    </div>
  </div>
  <script>
    document.getElementById("countModal")?.addEventListener("shown.bs.modal", function () {
    
      fetch("/api/get-parade-count")
        .then(response => response.json())
        .then(data => {
          const tbody = document.querySelector("#paradeDisplayTable tbody");
          tbody.innerHTML = "";
      
          let totalC1 = 0, totalC2 = 0, totalC3 = 0, totalC4 = 0, grandTotal = 0;
      
          Object.keys(data).forEach(rank => {
            let c1 = data[rank].c1 || 0;
            let c2 = data[rank].c2 || 0;
            let c3 = data[rank].c3 || 0;
            let c4 = data[rank].c4 || 0;
            let total = c1 + c2 + c3 + c4;
      
            // Accumulate totals
            totalC1 += c1;
            totalC2 += c2;
            totalC3 += c3;
            totalC4 += c4;
            grandTotal += total;
      
            tbody.innerHTML += `
              <tr>
                <td class="fw-bold text-start">${rank}</td>
                <td>${c1}</td>
                <td>${c2}</td>
                <td>${c3}</td>
                <td>${c4}</td>
                <td class="fw-bold text-primary">${total}</td>
              </tr>
            `;
          });
      
          // Add TOTAL Row
          tbody.innerHTML += `
            <tr class="table-info fw-bold">
              <td class="text-start">TOTAL</td>
              <td>${totalC1}</td>
              <td>${totalC2}</td>
              <td>${totalC3}</td>
              <td>${totalC4}</td>
              <td class="text-primary">${grandTotal}</td>
            </tr>
          `;
      })
      
        .catch(() => {
            document.querySelector("#paradeDisplayTable tbody").innerHTML = 
            `<tr><td colspan="6" class="text-danger text-center">⚠ Error loading data</td></tr>`;
        });
    
    });


    document.getElementById("printParadeBtn")?.addEventListener("click", function () {
      const modalBody = document.querySelector("#paradeDisplayTable").outerHTML;
      const clientIp = window.CLIENT_IP || "{{ client_ip or '127.0.0.1' }}";
      const now = new Date();
      const cpDay = String(now.getDate()).padStart(2, '0');
      const cpMon = String(now.getMonth() + 1).padStart(2, '0');
      const cpYr = now.getFullYear();
      const printTimeStr = `${cpDay}/${cpMon}/${cpYr} ` + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      
      const watermarkSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="460" height="280"><g transform="rotate(-35 230 140)"><text x="230" y="95" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="rgba(80,100,160,0.12)" text-anchor="middle" letter-spacing="3">15 CORPS ENGG SIG REGT</text><text x="230" y="122" font-family="Arial,sans-serif" font-size="16" font-weight="900" fill="rgba(40,60,120,0.14)" text-anchor="middle" letter-spacing="2">IP ${clientIp}</text><text x="230" y="146" font-family="Arial,sans-serif" font-size="11" font-weight="600" fill="rgba(80,100,160,0.11)" text-anchor="middle" letter-spacing="1">${printTimeStr}</text></g></svg>`;
      const bgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(watermarkSvg);

      const printWindow = window.open("", "", "width=900,height=700");
    
      printWindow.document.write(`
        <html>
        <head>
          <title>Parade State Report</title>
          <style>
              body {
                  font-family: Arial, sans-serif;
                  padding: 20px;
                  position: relative;
              }
              .watermark-overlay {
                  position: fixed;
                  top: 0; left: 0; right: 0; bottom: 0;
                  width: 100vw; height: 100vh;
                  background-image: url("${bgUrl}");
                  background-repeat: repeat;
                  pointer-events: none;
                  z-index: 999999;
                  -webkit-print-color-adjust: exact;
                  print-color-adjust: exact;
              }
              h2 {
                  text-align: center;
                  margin-bottom: 8px;
              }
              .meta-bar {
                  display: flex;
                  justify-content: space-between;
                  font-size: 12px;
                  color: #444;
                  border-bottom: 1px dashed #888;
                  padding-bottom: 6px;
                  margin-bottom: 16px;
              }
              table {
                  width: 100%;
                  border-collapse: collapse;
                  margin-bottom: 20px;
              }
              th, td {
                  border: 1px solid #444;
                  padding: 8px;
                  text-align: center;
              }
              th {
                  background: #dce7ff;
                  font-weight: bold;
              }
              .total-row {
                  background-color: #e6f4ea;
                  font-weight: bold;
              }
          </style>
        </head>
        <body>
            <div class="watermark-overlay"></div>
            <h2>📋 Parade State Report</h2>
            <div class="meta-bar">
                <span><strong>Device IP:</strong> ${clientIp}</span>
                <span><strong>Date:</strong> ${printTimeStr}</span>
            </div>
            ${modalBody}
        </body>
        </html>
      `);
    
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    });
    
    </script>
