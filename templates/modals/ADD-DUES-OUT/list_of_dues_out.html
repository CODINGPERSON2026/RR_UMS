<style>
  /* =========================================================
     MODAL SIZE + POSITION
  ========================================================= */
  #duesOutListModal .custom-size {
    max-width: 97% !important;
    width: 97% !important;
  }

  #duesOutListModal .modal-dialog {
    margin-top: 1px;
  }

  #duesOutListModal .modal-content {
    border: none;
    border-radius: .8rem;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, .28);
    animation: duesModalSlideUp .25s ease;
  }

  @keyframes duesModalSlideUp {
    from {
      opacity: 0;
      transform: translateY(10px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* =========================================================
     MODAL BODY
  ========================================================= */
  #duesOutListModal .modal-body {
    overflow: auto;
  }

  /* =========================================================
     HEADER
  ========================================================= */
  #duesOutListModal .modal-header {
    border-bottom: 1px solid #eef1f5;
  }

  #duesOutListModal .modal-title {
    font-size: 1rem;
    font-weight: 700;
    color: #212529;
  }

  /* =========================================================
     SEARCH
  ========================================================= */
  #duesOutListModal .duesSearchWrap {
    position: relative;
    width: 230px;
  }

  #duesOutListModal .duesSearchWrap input {
    width: 100%;
    padding: 7px 12px 7px 34px;
    border: 1px solid #dfe3e8;
    border-radius: 8px;
    font-size: .83rem;
    background: #fff;
    outline: none;
    transition: .18s ease;
  }

  #duesOutListModal .duesSearchWrap input:focus {
    border-color: #86b7fe;
    box-shadow: 0 0 0 .15rem rgba(13, 110, 253, .12);
  }

  #duesOutListModal .duesSearchIcon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: #9ca3af;
  }

  /* =========================================================
     COUNT BADGE
  ========================================================= */
  #duesOutListModal .duesCountWrap {
    background: #eef4ff;
    border: 1px solid #d6e4ff;
  }

  #duesOutListModal .duesCountLabel {
    color: #315ca8;
    font-size: .8rem;
    font-weight: 600;
  }

  #duesOutListModal .duesCountBadge {
    font-size: .78rem;
    padding: 5px 10px;
    border-radius: 20px;
  }

  /* =========================================================
     TABLE WRAPPER
  ========================================================= */
  #duesOutListModal .duesTableWrapper {
    overflow-x: auto;
    width: 100%;
  }

  /* =========================================================
     TABLE
  ========================================================= */
  #duesOutListModal #duesOutTable {
    table-layout: fixed;
    width: 100%;
    min-width: 1300px;
  }

  #duesOutListModal #duesOutTable th,
  #duesOutListModal #duesOutTable td {
    overflow: hidden;
    vertical-align: middle;
    font-size: .84rem;
    padding: .58rem .65rem;
  }

  #duesOutListModal #duesOutTable th {
    white-space: nowrap;
    font-weight: 600;
    color: #ffffff !important;
    background-color: var(--primary-color) !important;
    border-color: var(--border-color);
  }

  /* =========================================================
     CELL SCROLL
  ========================================================= */
  #duesOutListModal .duesCellScroll {
    width: 100%;
    overflow-x: auto;
    white-space: nowrap;
    scrollbar-width: thin;
  }

  #duesOutListModal .duesCellScroll::-webkit-scrollbar {
    height: 4px;
  }

  #duesOutListModal .duesCellScroll::-webkit-scrollbar-thumb {
    background: #c7c7c7;
    border-radius: 20px;
  }

  /* =========================================================
     BADGES
  ========================================================= */
  #duesOutListModal .army-chip {
    display: inline-block;
    background: #eef4ff;
    color: #0d6efd;
    border: 1px solid #d7e5ff;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: .74rem;
    font-weight: 700;
    white-space: nowrap;
  }

  #duesOutListModal .rank-pill {
    display: inline-block;
    background: #fff3cd;
    color: #856404;
    border: 1px solid #ffe69c;
    border-radius: 6px;
    padding: 2px 8px;
    font-size: .74rem;
    font-weight: 600;
    white-space: nowrap;
  }

  /* =========================================================
     NAME CELL
  ========================================================= */
  #duesOutListModal .name-cell {
    font-weight: 600;
    color: #212529;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 0;
  }

  /* =========================================================
     REMARKS
  ========================================================= */
  #duesOutListModal .remarks-text {
    color: #6c757d;
  }

  /* =========================================================
     REMOVE BUTTON
  ========================================================= */
  #duesOutListModal .del-btn {
    border: none;
    background: #fff1f2;
    color: #dc3545;
    border: 1px solid #ffc9cf;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: .76rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: .18s ease;
  }

  #duesOutListModal .del-btn:hover {
    background: #ffe5e8;
  }

  /* =========================================================
     LOADER
  ========================================================= */
  #duesOutListModal .spinner-sm {
    width: 24px;
    height: 24px;
    border: 3px solid #dbe7ff;
    border-top-color: #0d6efd;
    border-radius: 50%;
    display: inline-block;
    animation: duesSpin .7s linear infinite;
  }

  @keyframes duesSpin {
    to {
      transform: rotate(360deg);
    }
  }

  /* =========================================================
     EMPTY STATE
  ========================================================= */
  #duesOutListModal .empty-cell {
    text-align: center;
    padding: 2.5rem;
    color: #6c757d;
    font-weight: 500;
  }

  /* =========================================================
     RESPONSIVE
  ========================================================= */
  @media(max-width:768px) {

    #duesOutListModal .custom-size {
      max-width: 100% !important;
      width: 100% !important;
      margin: 0;
    }

    #duesOutListModal .modal-content {
      border-radius: 0;
    }

    #duesOutListModal .duesSearchWrap {
      width: 100%;
    }

    #duesOutListModal .modal-header .d-flex {
      width: 100%;
    }

  #duesOutListModal .modal-dialog {
    margin-top: 1.5rem !important;
  }
</style>


<!-- =====================================================
       DUES OUT MODAL
  ===================================================== -->
<div class="modal fade" id="duesOutListModal" tabindex="-1">

  <div class="modal-dialog modal-xl custom-size">

    <div class="modal-content overflow-hidden">

      <!-- ================= HEADER ================= -->

      <div class="modal-header bg-primary text-white py-3 px-4 d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <h5 class="modal-title mb-0 text-white fw-bold" style="font-size:16px">Dues Out Details</h5>
          <span id="duesOutCount" class="badge rounded-pill shadow-sm" style="color: #1d4ed8 !important; background-color: #ffffff !important; font-size: 12px; font-weight: 700; padding: 4px 14px;">0 records</span>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="text-center py-2" style="background: rgba(37, 99, 235, 0.08); border-bottom: 1px solid rgba(37, 99, 235, 0.15);">
        <span class="badge shadow-sm" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; font-size: 12px; font-weight: 700; padding: 6px 18px; border-radius: 30px; letter-spacing: 0.5px;">
          <i class="fa fa-user-shield me-1"></i> UPDATED BY POSTING CLK
        </span>
      </div>

      <!-- ================= BODY ================= -->

      <div class="modal-body">

        <!-- Search box -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <div class="search-wrap" style="position:relative; width:260px;">
            <svg style="position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:#64748b;" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="6.5" cy="6.5" r="4.5" />
              <path d="M10.5 10.5l3 3" />
            </svg>
            <input type="text" id="duesOutSearch" class="form-control form-control-sm ps-4" placeholder="Search army no or name…">
          </div>
          <div class="d-flex align-items-center gap-2">
            <label class="form-label mb-0 fw-semibold text-secondary" style="font-size: 0.82rem;"><i class="fas fa-sort me-1"></i>Date of Move:</label>
            <select id="duesOutSortOrder" class="form-select form-select-sm" style="width: auto; font-size: 0.82rem;" onchange="duesOutSortOrder = this.value; duesOutCurrentPage = 1; duesOutFilterAndPaginate();">
              <option value="desc">Descending (Newest First)</option>
              <option value="asc">Ascending (Oldest First)</option>
            </select>
          </div>
        </div>

        <!-- ================= LOADER ================= -->

        <div id="duesOutLoader" class="text-center py-5">

          <span class="spinner-sm"></span>

          <div class="mt-2 text-muted">
            Fetching data...
          </div>

        </div>

        <!-- ================= TABLE ================= -->

        <div class="duesTableWrapper">

          <table id="duesOutTable" class="table table-bordered table-hover align-middle d-none">

            <thead class="table-light">

              <tr>

                <th style="width: 10%;">Action</th>
                <th style="width: 10%;">Army No</th>
                <th style="width: 8%;">Rank</th>
                <th style="width: 15%;">Name</th>
                <th style="width: 10%;">Trade</th>
                <th style="width: 10%;">Posted To</th>
                <th style="width: 12%; cursor: pointer;" onclick="toggleDuesOutSort()" title="Click to toggle Date of Move sort (Ascending / Descending)">
                  Dt of Move <span id="duesOutSortIcon">▼</span>
                </th>
                <th style="width: 12%;">Order No</th>
                <th style="width: 13%;">Remarks</th>

              </tr>

            </thead>

            <tbody id="duesOutTableBody"></tbody>

          </table>

        </div>

      </div>

      <!-- Footer Pagination -->
      <div class="modal-footer d-flex justify-content-between align-items-center flex-wrap px-4 py-3" style="gap:10px; background:#f8fafc; border-top:1px solid #e2e8f0;">
        <span class="text-muted" style="font-size:0.85rem;">
          Showing <strong id="duesOutPageStart">0</strong>–<strong id="duesOutPageEnd">0</strong> of
          <strong id="duesOutTotalFiltered">0</strong> records
        </span>

        <div class="d-flex align-items-center gap-2" id="duesOutPaginationControls">
          <button class="btn btn-sm btn-outline-primary px-3 rounded-pill" id="duesOutPrevBtn" onclick="duesOutChangePage(-1)" disabled>
            <i class="fas fa-chevron-left me-1"></i> Prev
          </button>
          <span style="font-size:0.82rem; font-weight:600; color:#334155;">
            Page <span id="duesOutCurrentPageNum">1</span> of <span id="duesOutTotalPagesNum">1</span>
          </span>
          <button class="btn btn-sm btn-outline-primary px-3 rounded-pill" id="duesOutNextBtn" onclick="duesOutChangePage(1)" disabled>
            Next <i class="fas fa-chevron-right ms-1"></i>
          </button>
        </div>

        <button class="btn btn-sm btn-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
      </div>

    </div>

  </div>

</div>


<script>
  var duesOutData = [];
  var duesOutFilteredData = [];
  var duesOutPageSize = 20;
  var duesOutCurrentPage = 1;
  var duesOutSortOrder = 'desc';

  function toggleDuesOutSort() {
    duesOutSortOrder = duesOutSortOrder === 'asc' ? 'desc' : 'asc';
    const sel = document.getElementById('duesOutSortOrder');
    if (sel) sel.value = duesOutSortOrder;
    duesOutCurrentPage = 1;
    duesOutFilterAndPaginate();
  }

  function formatDuesOutDate(date) {
    if (!date) return "—";
    const dt = new Date(date);
    if (isNaN(dt.getTime())) return date;
    const day = String(dt.getDate()).padStart(2, "0");
    const month = String(dt.getMonth() + 1).padStart(2, "0");
    const year = dt.getFullYear();
    return `${day}/${month}/${year}`;
  }

  document.getElementById("duesOutListModal")?.addEventListener("show.bs.modal", async function () {
    duesOutCurrentPage = 1;
    await loadDuesOutData();
  });

  async function loadDuesOutData() {
    const loader = document.getElementById("duesOutLoader");
    const table  = document.getElementById("duesOutTable");
    const tbody  = document.getElementById("duesOutTableBody");

    loader.classList.remove("d-none");
    table.classList.add("d-none");
    tbody.innerHTML = "";

    try {
      const response = await fetch("/dues/dues-out/list");
      const result   = await response.json();
      if (!result.success) throw new Error("Failed");

      duesOutData = result.data || [];
      duesOutFilterAndPaginate();

    } catch (error) {
      console.error(error);
      loader.innerHTML = `<p class="text-danger fw-bold mt-3">Failed to load data</p>`;
    }
  }

  function duesOutFilterAndPaginate() {
    const v = (document.getElementById("duesOutSearch")?.value || "").toLowerCase().trim();
    let filtered = v ? duesOutData.filter(r =>
      (r.army_number || "").toLowerCase().includes(v) ||
      (r.name || "").toLowerCase().includes(v) ||
      (r.rank || "").toLowerCase().includes(v) ||
      (r.posted_to || "").toLowerCase().includes(v) ||
      (r.trade || "").toLowerCase().includes(v)
    ) : [...duesOutData];

    // Sort by date_of_move
    filtered.sort((a, b) => {
      const dateA = a.date_of_move ? new Date(a.date_of_move).getTime() : 0;
      const dateB = b.date_of_move ? new Date(b.date_of_move).getTime() : 0;
      return duesOutSortOrder === 'asc' ? dateA - dateB : dateB - dateA;
    });

    duesOutFilteredData = filtered;

    const icon = document.getElementById('duesOutSortIcon');
    if (icon) icon.textContent = duesOutSortOrder === 'asc' ? '▲' : '▼';

    const countEl = document.getElementById("duesOutCount");
    if (countEl) countEl.textContent = duesOutData.length + " records";

    const totalPages = Math.ceil(duesOutFilteredData.length / duesOutPageSize) || 1;
    if (duesOutCurrentPage < 1) duesOutCurrentPage = 1;
    if (duesOutCurrentPage > totalPages) duesOutCurrentPage = totalPages;

    const start = (duesOutCurrentPage - 1) * duesOutPageSize;
    const end   = start + duesOutPageSize;
    const pageSlice = duesOutFilteredData.slice(start, end);

    renderDuesOutTableSlice(pageSlice, start, duesOutFilteredData.length, totalPages);
  }

  function duesOutChangePage(delta) {
    duesOutCurrentPage += delta;
    duesOutFilterAndPaginate();
  }

  function renderDuesOutTableSlice(dataSlice, startIndex, totalFilteredCount, totalPages) {
    const tbody        = document.getElementById("duesOutTableBody");
    const loader       = document.getElementById("duesOutLoader");
    const table        = document.getElementById("duesOutTable");
    const startEl      = document.getElementById("duesOutPageStart");
    const endEl        = document.getElementById("duesOutPageEnd");
    const totalEl      = document.getElementById("duesOutTotalFiltered");
    const pageNum      = document.getElementById("duesOutCurrentPageNum");
    const totalPagesEl = document.getElementById("duesOutTotalPagesNum");
    const prevBtn      = document.getElementById("duesOutPrevBtn");
    const nextBtn      = document.getElementById("duesOutNextBtn");

    tbody.innerHTML = "";

    if (totalEl) totalEl.textContent = totalFilteredCount;
    if (totalFilteredCount === 0) {
      if (startEl) startEl.textContent = 0;
      if (endEl)   endEl.textContent   = 0;
    } else {
      if (startEl) startEl.textContent = startIndex + 1;
      if (endEl)   endEl.textContent   = Math.min(startIndex + dataSlice.length, totalFilteredCount);
    }

    if (pageNum) pageNum.textContent = totalPages === 0 ? 0 : duesOutCurrentPage;
    if (totalPagesEl) totalPagesEl.textContent = totalPages;

    if (prevBtn) prevBtn.disabled = duesOutCurrentPage <= 1;
    if (nextBtn) nextBtn.disabled = duesOutCurrentPage >= totalPages;

    if (dataSlice.length === 0) {
      tbody.innerHTML = `<tr><td colspan="9" class="empty-cell text-center py-4 text-muted">No records found</td></tr>`;
    } else {
      dataSlice.forEach(row => {
        tbody.insertAdjacentHTML(
          "beforeend",
          `
          <tr id="dues-row-${row.id}">
            <td>
              <button class="del-btn duesDeleteBtn" data-id="${row.id}">
                <i class="fas fa-trash"></i> Remove
              </button>
            </td>
            <td>
              <div class="duesCellScroll">
                <span class="army-chip">${row.army_number || ""}</span>
              </div>
            </td>
            <td>
              <div class="duesCellScroll">
                <span class="rank-pill">${row.rank || ""}</span>
              </div>
            </td>
            <td class="name-cell">
              ${(row.name || "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase())}
            </td>
            <td>
              <div class="duesCellScroll">${row.trade || "—"}</div>
            </td>
            <td>
              <div class="duesCellScroll">
                ${(row.posted_to || "").toLowerCase().replace(/\b\w/g, c => c.toUpperCase())}
              </div>
            </td>
            <td>
              <div class="duesCellScroll">${formatDuesOutDate(row.date_of_move)}</div>
            </td>
            <td>
              <div class="duesCellScroll">${row.posting_order_no || "—"}</div>
            </td>
            <td class="remarks-text">
              <div class="duesCellScroll">${row.remarks || "—"}</div>
            </td>
          </tr>
          `
        );
      });
    }

    loader.classList.add("d-none");
    table.classList.remove("d-none");

    /* Delete Event Binding */
    document.querySelectorAll(".duesDeleteBtn").forEach(btn => {
      btn.onclick = async function () {
        const id = this.dataset.id;
        if (!confirm("Are you sure you want to remove this record?")) return;
        try {
          const response = await fetch(`/dues/dues-out/delete/${id}`, { method: "DELETE" });
          const result = await response.json();
          if (result.success) {
            duesOutData = duesOutData.filter(r => String(r.id) !== String(id));
            duesOutFilterAndPaginate();
            if (typeof showStatusModal === 'function') {
              showStatusModal("Removed successfully", "Red", 2500);
            }
          } else {
            alert(result.message || "Delete failed");
          }
        } catch (error) {
          console.error(error);
          alert("Something went wrong");
        }
      };
    });
  }

  document.getElementById("duesOutSearch")?.addEventListener("input", function () {
    duesOutCurrentPage = 1;
    duesOutFilterAndPaginate();
  });
</script>
