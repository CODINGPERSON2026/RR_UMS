<!-- PENDING CASES MODAL -->
<style>
  #pendingCasesModal .modal-dialog {
    max-width: 1250px;
    width: 98vw;
  }
  #pendingCasesModal .modal-content {
    border-radius: 16px;
    border: none;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    overflow: hidden;
    background: var(--card-bg-solid, #fff);
    min-height: 540px;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
  }
  .pc-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 22px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    color: white;
    flex-shrink: 0;
  }
  .pc-header h5 { margin: 0; font-size: 1.3rem; font-weight: 800; letter-spacing: 0.5px; }
  .pc-last-updated { font-size: 0.75rem; opacity: 0.9; margin-top: 3px; font-weight: 500; }
  .pc-body {
    padding: 14px 16px 12px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 460px;
  }
  /* Scrollable table wrapper — shows all 30 rows */
  .pc-table-scroll {
    overflow-y: auto;
    overflow-x: auto;
    flex: 1;
    min-height: 400px;
    max-height: calc(92vh - 140px);
    border: 1px solid #e2e8f0;
    border-radius: 8px;
  }
  .pc-table-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .pc-table-scroll::-webkit-scrollbar-track { background: #f1f5f9; }
  .pc-table-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 3px; }
  .pc-table-scroll::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

  #pendingCasesTable { font-size: 12.5px; margin-bottom: 0; }
  #pendingCasesTable thead th {
    background: #1e3a8a;
    color: white;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    white-space: nowrap;
    vertical-align: middle;
    text-align: center;
    padding: 9px 10px;
    border: none;
    position: sticky;
    top: 0;
    z-index: 2;
  }
  #pendingCasesTable thead th:nth-child(2) { text-align: left; }
  #pendingCasesTable tbody tr { vertical-align: middle; }
  #pendingCasesTable tbody td {
    padding: 6px 10px;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    text-align: center;
    white-space: nowrap;
  }
  #pendingCasesTable tbody td:nth-child(2) { text-align: left; font-weight: 600; white-space: nowrap; }
  #pendingCasesTable tbody tr:hover { background: rgba(37,99,235,0.05); }
  /* Sticky total footer */
  #pendingCasesTable tfoot tr td {
    position: sticky;
    bottom: 0;
    background: #1e3a8a !important;
    color: white !important;
    font-weight: 800;
    font-size: 12px;
    border: none !important;

  }
  .pc-edit-btn {
    border: none; background: rgba(37,99,235,0.1); color: #2563eb;

    font-weight: 600;
  }
  .pc-edit-btn:hover { background: #2563eb; color: white; }
  .pc-save-btn {
    border: none; background: rgba(22,163,74,0.15); color: #16a34a;
    border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 11px; margin-right: 4px; font-weight: 700;
  }
  .pc-save-btn:hover { background: #16a34a; color: white; }
  .pc-cancel-btn {
    border: none; background: rgba(220,53,69,0.12); color: #dc3545;
    border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 11px; font-weight: 700;

  .pc-cancel-btn:hover { background: #dc3545; color: white; }
  .pc-num-input { width: 68px; border: 1px solid #3b82f6; border-radius: 4px; padding: 2px 5px; font-size: 12px; text-align: center; font-weight: 600; }
  .pc-rem-input { width: 140px; border: 1px solid #3b82f6; border-radius: 4px; padding: 2px 6px; font-size: 12px; }
  .pc-dt-cell { font-size: 11px; color: #475569; white-space: nowrap; font-weight: 500; }
  .pc-locked-val {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-weight: 700;
    color: #64748b;
    background: #f1f5f9;

    padding: 2px 6px;

    min-width: 48px;

  .pc-co-btn {
    border: none;
    background: rgba(37,99,235,0.12);
    color: #1e3a8a;
    border: 1px solid rgba(37,99,235,0.25);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .pc-co-btn:hover {
    background: #1e3a8a;
    color: white;
  }

  /* Remarks Count Badge */
  .pc-count-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: rgba(37, 99, 235, 0.1);
    color: #1e3a8a;
    border: 1px solid rgba(37, 99, 235, 0.28);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .pc-count-badge:hover {
    background: #1e3a8a;
    color: #ffffff;
    border-color: #1e3a8a;
  }
  .pc-count-badge.pc-count-zero {
    background: #f8fafc;
    color: #64748b;
    border: 1px dashed #cbd5e1;
    font-weight: 500;
  }
  .pc-count-badge.pc-count-zero:hover {
    background: #f1f5f9;
    color: #1e293b;
    border-color: #94a3b8;
  }

  /* Floating Remarks Dropdown Panel */
  .pc-remarks-dropdown {
    position: fixed;
    z-index: 1070;
    width: 360px;
    max-width: 94vw;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 12px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.22);
    padding: 12px;
    display: none;
    flex-direction: column;
    gap: 8px;
    animation: pcFadeIn 0.15s ease-out;
  }
  .pc-remarks-dropdown.show {
    display: flex;
  }
  @keyframes pcFadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .pc-dropdown-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 7px;
    border-bottom: 1px solid #e2e8f0;
  }
  .pc-dropdown-title {
    font-size: 12px;
    font-weight: 800;
    color: #1e3a8a;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 290px;
  }
  .pc-dropdown-close {
    background: none;
    border: none;
    color: #94a3b8;
    font-size: 15px;
    cursor: pointer;
    padding: 1px 6px;
    border-radius: 4px;
    line-height: 1;
  }
  .pc-dropdown-close:hover {
    color: #dc3545;
    background: #fef2f2;
  }
  .pc-remarks-list {
    max-height: 230px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding-right: 2px;
  }
  .pc-remarks-list::-webkit-scrollbar { width: 4px; }
  .pc-remarks-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

  /* Remark Cards */
  .pc-remark-card {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-left: 3.5px solid #2563eb;
    border-radius: 8px;
    padding: 8px 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    text-align: left;
  }
  .pc-remark-card.role-co {
    border-left-color: #dc2626;
    background: #fffafa;
  }
  .pc-remark-card.role-2ic {
    border-left-color: #7c3aed;
    background: #faf5ff;
  }
  .pc-remark-card.role-docjc {
    border-left-color: #059669;
    background: #f0fdf4;
  }
  .pc-remark-card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    margin-bottom: 4px;
  }
  .pc-remark-author {
    color: #1e3a8a;
    font-weight: 700;
  }
  .pc-remark-card.role-co .pc-remark-author {
    color: #b91c1c;
  }
  .pc-remark-card.role-2ic .pc-remark-author {
    color: #6d28d9;
  }
  .pc-remark-card.role-docjc .pc-remark-author {
    color: #047857;
  }
  .pc-remark-time {
    color: #64748b;
    font-size: 10px;
    font-weight: 500;
  }
  .pc-remark-text {
    font-size: 12px;
    color: #1e293b;
    line-height: 1.35;
    word-break: break-word;
  }
  .pc-remark-add-box {
    padding-top: 8px;
    border-top: 1px solid #e2e8f0;
  }
</style>

<!-- Floating Remarks Dropdown Panel -->
<div id="pcRemarksDropdown" class="pc-remarks-dropdown" data-open-id="">
  <div class="pc-dropdown-header">
    <span class="pc-dropdown-title">
      <i class="fa fa-comments text-primary"></i>
      <span id="pcDropdownCaseTitle">Case Remarks</span>
    </span>
    <button type="button" class="pc-dropdown-close" onclick="pcCloseRemarksDropdown()">&times;</button>
  </div>
  <div class="pc-remarks-list" id="pcDropdownRemarksList">
    <!-- Rendered dynamically -->
  </div>
  <div class="pc-remark-add-box">
    <div class="input-group input-group-sm">
      <input type="text" id="pcDropdownRemarkInput" class="form-control" placeholder="Write a remark..." onkeydown="if(event.key==='Enter'){event.preventDefault();pcSubmitDropdownRemark();}">
      <button class="btn btn-primary btn-sm" id="pcDropdownSubmitBtn" type="button" onclick="pcSubmitDropdownRemark()" title="Post Remark">
        <i class="fa fa-paper-plane me-1"></i>Add
      </button>
    </div>
  </div>

<script>
(function() {
  {% set r_clean = (role or '')|upper|replace(' ', '')|replace('_', '')|replace('-', '') %}
  const CURRENT_ROLE = '{{ (role or "Authority")|upper|trim }}';
  const PC_CAN_EDIT = {{ 'true' if (role and role|upper in ['CO', 'COMMANDING OFFICER', '2IC', 'ADJUTANT', 'ACCOUNT OFFICER', 'ACCOUNTS OFFICER', 'ACCOUNT JCO', 'ACCOUNTS JCO', 'ACCOUNT CLK', 'ACCOUNTS CLK', 'ADMIN', 'SUPERADMIN', 'DOCJC']) or r_clean in ['CO', 'COMMANDINGOFFICER', '2IC', 'ADJUTANT', 'ACCOUNTOFFICER', 'ACCOUNTSOFFICER', 'ACCOUNTJCO', 'ACCOUNTSJCO', 'ACCOUNTCLK', 'ACCOUNTSCLK', 'ADMIN', 'SUPERADMIN', 'DOCJC'] else 'false' }};
  const IS_REMARK_ONLY_ROLE = {{ 'true' if (role and role|upper in ['CO', 'COMMANDING OFFICER', 'COMMANDINGOFFICER', '2IC', 'SECOND IN COMMAND', 'SECONDINCOMMAND', 'ADJUTANT']) or r_clean in ['CO', 'COMMANDINGOFFICER', '2IC', 'SECONDINCOMMAND', 'ADJUTANT'] else 'false' }};
  const IS_DOCJC_ROLE = {{ 'true' if (role and ('DOC' in role|upper or 'DOCJC' in role|upper)) or 'DOC' in r_clean else 'false' }};

  const DEFAULT_CASE_NAMES = [
    'Posting IN', 'Posting OUT', 'Pension Out', 'TPTL', 'Lve', 'TFRGTH', 'HRA', 'RUMCIG',
    'PRPLVE/JRNYD', 'Medal', 'Med Cat', 'CEA', 'Marriage/Divorce', 'Change of Name',
    'Birth', 'Demise', 'Civ Edn/MILEDN', 'ACCLVE', 'UID/PAN', 'Jt Acct',
    'OPTFIX', 'PFWDL', 'Mobile No/Email', 'Change Address', 'Injury Report',
    'Hosp Adm/Tfr/Disch', 'PROVFS', 'LTC', 'RISK', 'HAUCA'
  ];

  function buildDefaultCaseRows() {
    return DEFAULT_CASE_NAMES.map((name, index) => ({
      id: index + 1,
      type_of_case: name,
      pending_last_week: 0,
      recd_current_week: 0,
      total_cases: 0,
      pub_this_week: 0,
      under_prog: 0,
      remarks: '',
      remarks_list: [],
      remarks_count: 0,
      updated_by: null,
      updated_at: null,
      updated_at_ts: null
    }));
  }

  let pcData = buildDefaultCaseRows();

  document.getElementById('pendingCasesModal').addEventListener('show.bs.modal', function() {
    loadPendingCases();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadPendingCases);
  } else {
    loadPendingCases();
  }

  document.getElementById('pendingCasesModal').addEventListener('hidden.bs.modal', function() {
    pcCloseRemarksDropdown();
  });

  const scrollWrapper = document.getElementById('pcTableScrollWrapper');
  if (scrollWrapper) {
    scrollWrapper.addEventListener('scroll', function() {
      pcCloseRemarksDropdown();
    });
  }

  // Close dropdown on outside click
  document.addEventListener('click', function(e) {
    const dd = document.getElementById('pcRemarksDropdown');
    if (dd && dd.classList.contains('show')) {
      if (!dd.contains(e.target) && !e.target.closest('.pc-count-badge')) {
        pcCloseRemarksDropdown();
      }
    }
  });

  // Close dropdown on Escape key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      pcCloseRemarksDropdown();
    }
  });

  window.pcCloseRemarksDropdown = function() {
    const dd = document.getElementById('pcRemarksDropdown');
    if (dd) {
      dd.classList.remove('show');
      dd.dataset.openId = '';
    }
  };

  function loadPendingCases() {
    fetch('/pending_cases/get')
      .then(r => r.json())
      .then(res => {
        if (!res || !res.success || !Array.isArray(res.data) || res.data.length === 0) {
          pcData = buildDefaultCaseRows();
        } else {
          pcData = res.data;
        }
        window.renderTable(pcData);
        updateLastUpdated(pcData);
      })
      .catch(err => {
        console.error('Failed to load pending cases:', err);
        if (!pcData || pcData.length === 0) {
          pcData = buildDefaultCaseRows();
          window.renderTable(pcData);
        }
      });
  }

  function updateLastUpdated(data) {
    let latestRow = null;
    let maxTs = -1;
    (data || []).forEach(row => {
      const ts = Number(row.updated_at_ts) || 0;
      if (ts > maxTs && row.updated_at) {
        maxTs = ts;
        latestRow = row;
      }
    });
    const headerEl = document.getElementById('pcLastUpdated');
    if (headerEl) {
      headerEl.textContent = latestRow && latestRow.updated_at
        ? 'Last Updated: ' + latestRow.updated_at
        : 'Last Updated: \u2014';
    }
  }

  /* Exposed so inline handlers can cancel edit cleanly */
  window.pcCancelEdit = function() {
    window.renderTable(pcData);
  };

  /* Open / Toggle Floating Remarks Dropdown */
  window.pcToggleRemarksDropdown = function(e, id) {
    e.stopPropagation();
    const dropdown = document.getElementById('pcRemarksDropdown');
    if (!dropdown) return;

    if (dropdown.dataset.openId === String(id) && dropdown.classList.contains('show')) {
      pcCloseRemarksDropdown();
      return;
    }

    const row = (pcData || []).find(r => r.id === id);
    if (!row) return;

    const btn = e.currentTarget;
    const btnRect = btn.getBoundingClientRect();
    dropdown.dataset.openId = String(id);

    // Set title
    const titleEl = document.getElementById('pcDropdownCaseTitle');
    if (titleEl) {
      titleEl.textContent = row.type_of_case;
    }

    // Render remarks list
    renderDropdownRemarksList(row);

    // Reset input
    const inp = document.getElementById('pcDropdownRemarkInput');
    if (inp) {
      inp.value = '';
      inp.placeholder = `Write remark as ${CURRENT_ROLE}...`;
    }

    dropdown.classList.add('show');

    // Position panel near clicked button
    const dropdownWidth = 360;
    let left = btnRect.left + (btnRect.width / 2) - (dropdownWidth / 2);
    if (left < 10) left = 10;
    if (left + dropdownWidth > window.innerWidth - 10) {
      left = window.innerWidth - dropdownWidth - 10;
    }

    let top = btnRect.bottom + 6;
    // If overflowing bottom of window, open upwards
    if (top + 280 > window.innerHeight) {
      top = Math.max(10, btnRect.top - 290);
    }

    dropdown.style.left = left + 'px';
    dropdown.style.top = top + 'px';

    if (inp) {
      setTimeout(() => inp.focus(), 100);
    }
  };

  function renderDropdownRemarksList(row) {
    const listEl = document.getElementById('pcDropdownRemarksList');
    if (!listEl) return;
    const rems = row.remarks_list || [];

    if (rems.length === 0) {
      listEl.innerHTML = `<div class="text-center text-muted py-3" style="font-size:12px;">No remarks added yet</div>`;
      return;
    }

    listEl.innerHTML = rems.map(rem => {
      const rRole = (rem.remarked_by_role || rem.remarked_by || '').toUpperCase();
      let roleCls = '';
      if (rRole.includes('CO') && !rRole.includes('ONCO') && !rRole.includes('COMN')) roleCls = 'role-co';
      else if (rRole.includes('2IC')) roleCls = 'role-2ic';
      else if (rRole.includes('DOCJC')) roleCls = 'role-docjc';

      return `
        <div class="pc-remark-card ${roleCls}">
          <div class="pc-remark-card-top">
            <span class="pc-remark-author"><i class="fa fa-user-circle me-1"></i>Remarked by : <strong>${escHtml(rem.remarked_by_role || rem.remarked_by)}</strong></span>
            <span class="pc-remark-time"><i class="fa fa-clock me-1"></i>${escHtml(rem.created_at)}</span>
          </div>
          <div class="pc-remark-text">${escHtml(rem.remark)}</div>
        </div>
      `;
    }).join('');
  }

  /* Submit remark from inside dropdown panel */
  window.pcSubmitDropdownRemark = function(id) {
    const dd = document.getElementById('pcRemarksDropdown');
    const currentId = id || (dd ? parseInt(dd.dataset.openId, 10) : 0);
    if (!currentId) return;

    const inp = document.getElementById('pcDropdownRemarkInput');
    if (!inp) return;
    const text = inp.value.trim();
    if (!text) {
      alert('Please enter a remark');
      return;
    }

    const btn = document.getElementById('pcDropdownSubmitBtn');
    if (btn) btn.disabled = true;

    fetch(`/pending_cases/add_remark/${currentId}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ remark: text })
    })
    .then(r => r.json())
    .then(res => {
      if (btn) btn.disabled = false;
      if (res && res.success) {
        inp.value = '';
        const row = (pcData || []).find(r => r.id === currentId);
        if (row) {
          row.remarks_list = res.remarks_list || [];
          row.remarks_count = res.remarks_count || 0;
          row.remarks = res.latest_remark;
          if (res.updated_at) row.updated_at = res.updated_at;
          if (res.updated_at_ts) row.updated_at_ts = res.updated_at_ts;
          renderDropdownRemarksList(row);
        }
        window.renderTable(pcData);
        updateLastUpdated(pcData);
      } else {
        alert('Error: ' + (res && res.message ? res.message : 'Failed to post remark'));
      }
    })
    .catch(err => {
      if (btn) btn.disabled = false;
      console.error(err);
      alert('Network error while saving remark');
    });
  };

  /* Exposed to window so onclick handlers can re-render safely */
  window.renderTable = function renderTable(data) {
    const tbody = document.getElementById('pcTableBody');
    if (!tbody) return;
    if (!data || data.length === 0) {
      data = buildDefaultCaseRows();
      pcData = data;
    }
    let totPending = 0, totRecd = 0, totPub = 0, totTotal = 0, totUnder = 0;

    const rows = (data || []).map((row, idx) => {
      const pCount = (row.pending_last_week || 0);
      const rCount = (row.recd_current_week || 0);
      const pubCount = (row.pub_this_week || 0);
      const tCount = pCount + rCount;
      const uCount = (row.under_prog !== undefined && row.under_prog !== null) ? Number(row.under_prog) : Math.max(0, tCount - pubCount);

      totPending += pCount;
      totRecd    += rCount;
      totPub     += pubCount;
      totTotal   += tCount;
      totUnder   += uCount;

      let actionCell = '';
      if (PC_CAN_EDIT) {
        if (IS_REMARK_ONLY_ROLE) {
          actionCell = `<button class="pc-co-btn" onclick="pcStartEdit(${row.id})" title="Add / View Remark for ${CURRENT_ROLE}"><i class="fa fa-comment-dots me-1"></i>Add Remark</button>`;
        } else {
          actionCell = `<button class="pc-edit-btn" onclick="pcStartEdit(${row.id})" title="Edit Row"><i class="fa fa-edit me-1"></i>Edit</button>`;
        }
      }

      const dtDisplay = row.updated_at
        ? `<span class="pc-dt-cell">${escHtml(row.updated_at)}</span>`
        : '<span class="pc-dt-cell" style="color:#94a3b8;">&mdash;</span>';

      const remCount = row.remarks_count || (row.remarks_list ? row.remarks_list.length : 0);
      const remBadgeHtml = `
        <button type="button" class="pc-count-badge ${remCount === 0 ? 'pc-count-zero' : ''}" onclick="pcToggleRemarksDropdown(event, ${row.id})" title="Click to open remarks dropdown">
          <i class="fa fa-comment-dots"></i>
          <span>${remCount} Remark${remCount !== 1 ? 's' : ''}</span>
          <i class="fa fa-chevron-down" style="font-size:8px;"></i>
        </button>
      `;

      return `<tr id="pcRow_${row.id}" data-id="${row.id}">
        <td>${idx + 1}</td>
        <td>${escHtml(row.type_of_case)}</td>
        <td id="pcPending_${row.id}">${pCount}</td>
        <td id="pcRecd_${row.id}">${rCount}</td>
        <td id="pcTotal_${row.id}" style="font-weight:700; color:#1e3a8a;">${tCount}</td>
        <td id="pcPub_${row.id}">${pubCount}</td>
        <td id="pcUnder_${row.id}">${uCount}</td>
        <td id="pcRem_${row.id}">${remBadgeHtml}</td>
        <td id="pcDt_${row.id}">${dtDisplay}</td>
        ${PC_CAN_EDIT ? `<td id="pcAct_${row.id}">${actionCell}</td>` : ''}
      </tr>`;
    }).join('');

    tbody.innerHTML = rows;

    document.getElementById('pcTotPending').textContent = totPending;
    document.getElementById('pcTotRecd').textContent    = totRecd;
    document.getElementById('pcTotTotal').textContent   = totTotal;
    document.getElementById('pcTotPub').textContent     = totPub;
    document.getElementById('pcTotUnder').textContent   = totUnder;

    document.querySelectorAll('.pc-action-col').forEach(el => {
      el.style.display = PC_CAN_EDIT ? '' : 'none';
    });
  };

  // Immediate initial render so the table never shrinks or flashes empty
  window.renderTable(pcData);

  window.pcHandleKey = function(e, id) {
    if (e.key === 'Enter') {
      e.preventDefault();
      window.pcSaveRow(id);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      window.pcCancelEdit();
    }
  };

  window.pcRecalcTotal = function(id) {
    const pInp = document.getElementById('ei_pending_' + id);
    const rInp = document.getElementById('ei_recd_' + id);
    const pubInp = document.getElementById('ei_pub_' + id);
    const tInp = document.getElementById('ei_total_' + id);
    const tDisp = document.getElementById('ei_total_disp_' + id);
    const uInp = document.getElementById('ei_under_' + id);
    const uDisp = document.getElementById('ei_under_disp_' + id);
    if (pInp && rInp) {
      const p = parseInt(pInp.value, 10) || 0;
      const r = parseInt(rInp.value, 10) || 0;
      const pub = pubInp ? (parseInt(pubInp.value, 10) || 0) : 0;
      const tot = p + r;
      const underProg = Math.max(0, tot - pub);
      if (tInp) tInp.value = tot;
      if (tDisp) tDisp.innerHTML = `${tot} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i>`;
      if (uInp) uInp.value = underProg;
      if (uDisp) uDisp.innerHTML = `${underProg} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i>`;
    }
  };

  window.pcStartEdit = function(id) {
    pcCloseRemarksDropdown();
    const row = (pcData || []).find(r => r.id === id);
    if (!row) return;

    const pCount = (row.pending_last_week || 0);
    const rCount = (row.recd_current_week || 0);
    const pubCount = (row.pub_this_week || 0);
    const tCount = pCount + rCount;

    if (IS_REMARK_ONLY_ROLE) {
      // Numbers are LOCKED for CO, 2IC, ADJUTANT roles — only Remark is editable
      document.getElementById('pcPending_' + id).innerHTML = `<span class="pc-locked-val" title="Locked for ${CURRENT_ROLE}: Counts managed by DOCJC">${pCount} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span>`;
      document.getElementById('pcRecd_'   + id).innerHTML = `<span class="pc-locked-val" title="Locked for ${CURRENT_ROLE}: Counts managed by DOCJC">${rCount} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span>`;
      document.getElementById('pcTotal_'  + id).innerHTML = `<span class="pc-locked-val" title="Locked for ${CURRENT_ROLE}: Counts managed by DOCJC">${tCount} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span>`;
      document.getElementById('pcPub_'    + id).innerHTML = `<span class="pc-locked-val" title="Locked for ${CURRENT_ROLE}: Counts managed by DOCJC">${pubCount} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span>`;
      document.getElementById('pcUnder_'  + id).innerHTML = `<span class="pc-locked-val" title="Locked for ${CURRENT_ROLE}: Counts managed by DOCJC">${row.under_prog || 0} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span>`;
      document.getElementById('pcRem_'    + id).innerHTML = `<input class="pc-rem-input" id="ei_rem_${id}" value="" placeholder="Type new remark to add as ${CURRENT_ROLE}..." style="border: 2px solid #1e3a8a; width: 100%; min-width: 160px;" onkeydown="pcHandleKey(event, ${id})">`;
    } else if (IS_DOCJC_ROLE) {
      // "lock columns for DOCJC Pending Cas of Last Week, Recd Cas Current Week, Total Cases"
      document.getElementById('pcPending_' + id).innerHTML = `<span class="pc-locked-val" title="Locked for DOCJC">${pCount} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span><input type="hidden" id="ei_pending_${id}" value="${pCount}">`;
      document.getElementById('pcRecd_'   + id).innerHTML = `<span class="pc-locked-val" title="Locked for DOCJC">${rCount} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span><input type="hidden" id="ei_recd_${id}" value="${rCount}">`;
      document.getElementById('pcTotal_'  + id).innerHTML = `<span class="pc-locked-val" id="ei_total_disp_${id}" style="font-weight:700; color:#1e3a8a;" title="Locked for DOCJC: Pending + Recd">${tCount} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span><input type="hidden" id="ei_total_${id}" value="${tCount}">`;
      document.getElementById('pcPub_'    + id).innerHTML = `<input class="pc-num-input" id="ei_pub_${id}"     value="${pubCount}" type="number" min="0" oninput="pcRecalcTotal(${id})" onkeydown="pcHandleKey(event, ${id})">`;
      document.getElementById('pcUnder_'  + id).innerHTML = `<span class="pc-locked-val" id="ei_under_disp_${id}" title="Under Prog = Total Cases - Published This Week">${Math.max(0, tCount - pubCount)} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span><input type="hidden" id="ei_under_${id}" value="${Math.max(0, tCount - pubCount)}">`;
      document.getElementById('pcRem_'    + id).innerHTML = `<input class="pc-rem-input" id="ei_rem_${id}"     value="" placeholder="Add remark..." onkeydown="pcHandleKey(event, ${id})">`;
    } else {
      // Admin: Full edit capability for all fields
      document.getElementById('pcPending_' + id).innerHTML = `<input class="pc-num-input" id="ei_pending_${id}" value="${pCount}" type="number" min="0" oninput="pcRecalcTotal(${id})" onkeydown="pcHandleKey(event, ${id})">`;
      document.getElementById('pcRecd_'   + id).innerHTML = `<input class="pc-num-input" id="ei_recd_${id}"    value="${rCount}" type="number" min="0" oninput="pcRecalcTotal(${id})" onkeydown="pcHandleKey(event, ${id})">`;
      document.getElementById('pcTotal_'  + id).innerHTML = `<input class="pc-num-input" id="ei_total_${id}"   value="${tCount}" type="number" min="0" readonly style="font-weight:700; color:#1e3a8a; background:#f1f5f9; cursor:not-allowed;" title="Total Cases = Pending + Recd" onkeydown="pcHandleKey(event, ${id})">`;
      document.getElementById('pcPub_'    + id).innerHTML = `<input class="pc-num-input" id="ei_pub_${id}"     value="${pubCount}" type="number" min="0" oninput="pcRecalcTotal(${id})" onkeydown="pcHandleKey(event, ${id})">`;
      document.getElementById('pcUnder_'  + id).innerHTML = `<span class="pc-locked-val" id="ei_under_disp_${id}" title="Under Prog = Total Cases - Published This Week">${Math.max(0, tCount - pubCount)} <i class="fa fa-lock" style="font-size:9px; opacity:0.6;"></i></span><input type="hidden" id="ei_under_${id}" value="${Math.max(0, tCount - pubCount)}">`;
      document.getElementById('pcRem_'    + id).innerHTML = `<input class="pc-rem-input" id="ei_rem_${id}"     value="" placeholder="Add remark..." onkeydown="pcHandleKey(event, ${id})">`;
    }

    document.getElementById('pcAct_'    + id).innerHTML = `
      <button class="pc-save-btn"   onclick="pcSaveRow(${id})"><i class="fa fa-check"></i> Save</button>
      <button class="pc-cancel-btn" onclick="pcCancelEdit()"><i class="fa fa-times"></i></button>`;

    const remInput = document.getElementById('ei_rem_' + id);
    if (remInput) {
      remInput.focus();
    }
  };

  window.pcSaveRow = function(id) {
    const remInput = document.getElementById('ei_rem_' + id);
    if (!remInput) return;

    let payload = {};
    if (IS_REMARK_ONLY_ROLE) {
      payload = {
        remarks: remInput.value.trim()
      };
    } else {
      const pInput   = document.getElementById('ei_pending_' + id);
      const rInput   = document.getElementById('ei_recd_'    + id);
      const pubInput = document.getElementById('ei_pub_'     + id);
      const uInput   = document.getElementById('ei_under_'   + id);
      const pVal = pInput ? (parseInt(pInput.value, 10) || 0) : 0;
      const rVal = rInput ? (parseInt(rInput.value, 10) || 0) : 0;
      const pubVal = pubInput ? (parseInt(pubInput.value, 10) || 0) : 0;
      const tVal = pVal + rVal;
      payload = {
        pending_last_week: pVal,
        recd_current_week: rVal,
        total_cases:       tVal,
        pub_this_week:     pubVal,
        under_prog:        uInput   ? (parseInt(uInput.value, 10)   || 0) : 0,
        remarks:           remInput.value.trim()
      };
    }

    fetch(`/pending_cases/update/${id}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(res => {
      if (res && res.success) {
        const row = (pcData || []).find(r => r.id === id);
        if (row) {
          if (res.row) {
            Object.assign(row, res.row);
          } else {
            Object.assign(row, payload);
            if (res.updated_at) row.updated_at = res.updated_at;
            if (res.updated_at_ts) row.updated_at_ts = res.updated_at_ts;
          }
          if (res.remarks_list) row.remarks_list = res.remarks_list;
          if (res.remarks_count !== undefined) row.remarks_count = res.remarks_count;
        }
        window.renderTable(pcData);
        updateLastUpdated(pcData);
      } else {
        alert('Error: ' + (res && res.message ? res.message : 'Save failed'));
      }
    })
    .catch(err => {
      console.error(err);
      alert('Network error while saving');
    });
  };

  function escHtml(str) {
    return String(str || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
})();
</script>
