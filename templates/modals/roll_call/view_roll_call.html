<style>
  #allPointsTableBody td:nth-child(4) {
    max-width: 450px;
    white-space: normal;
    word-break: break-word;
  }

  #allPointsTableBody tr:hover {
    background-color: #e3f2fd !important;
  }
</style>

<div class="modal fade" id="centerRollCallModal" tabindex="-1">
  <div class="modal-dialog modal-xl modal-dialog-scrollable modal-fullscreen-md-down"
       style="max-width: 1400px; margin-top: 2vh;">
    <div class="modal-content border-0 shadow-lg rounded-3 overflow-hidden">
      
      <!-- HEADER -->
      <div class="modal-header bg-primary text-white py-3">
        <div class="d-flex align-items-center gap-2">
          <i class="fa fa-list-alt fs-4"></i>
          <div>
            <h5 class="modal-title fw-bold mb-0">Roll Call Points View</h5>
            <small style="opacity: 0.88; font-size: 0.82rem;">All Pending Roll Call Points</small>
          </div>
        </div>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <div class="text-center py-2 d-flex justify-content-center align-items-center gap-2 flex-wrap" style="background: rgba(37, 99, 235, 0.08); border-bottom: 1px solid rgba(37, 99, 235, 0.15);">
        <span class="badge shadow-sm" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; font-size: 12px; font-weight: 700; padding: 6px 18px; border-radius: 30px; letter-spacing: 0.5px;">
          <i class="fa fa-list-check me-1"></i> ROLL CALL POINTS <span class="badge bg-white text-primary ms-1" id="allPointsCountBadge">0</span>
        </span>
        <span class="badge shadow-sm" id="rollCallLastUpdatedBadge" style="background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #ffffff; font-size: 12px; font-weight: 700; padding: 6px 18px; border-radius: 30px; letter-spacing: 0.5px;">
          <i class="fa fa-clock me-1"></i> LAST UPDATED: <span id="rollCallLastUpdatedTimestamp" class="rollcall-last-updated-text">--</span>
        </span>
      </div>

      <!-- MODAL BODY -->
      <div class="modal-body bg-light p-4">

        <!-- SEARCH BAR TOOLBAR -->
        <div class="d-flex align-items-center justify-content-between gap-3 mb-3 p-3 bg-white rounded-3 shadow-sm border">
          <div class="fw-bold text-dark d-flex align-items-center gap-2">
            <i class="fa fa-layer-group text-primary"></i>
            <span>All Roll Call Points</span>
          </div>
          <div class="search-box position-relative" style="min-width: 280px; flex-grow: 1; max-width: 450px;">
            <input type="text" id="allPointsSearchInput" class="form-control form-control-sm ps-4" placeholder="Search Army No, Name, Title, Description..." onkeyup="filterAllPointsSearch()">
            <i class="fa fa-search position-absolute text-muted" style="left: 10px; top: 50%; transform: translateY(-50%); font-size: 0.8rem;"></i>
          </div>
        </div>

        <!-- TABLE -->
        <div class="table-responsive bg-white rounded-3 shadow-sm border">
          <table class="table table-bordered table-hover align-middle table-striped mb-0">
            <thead class="bg-dark text-white shadow-sm" style="position: sticky; top: 0; z-index: 10;">
              <tr class="text-uppercase fw-semibold" style="font-size: 0.84rem;">
                <th class="text-center" style="width: 50px;">#</th>
                <th style="width: 260px;">Personnel Info</th>
                <th>Point Title</th>
                <th style="min-width: 350px;">Description</th>
                <th style="width: 120px;">Date</th>
              </tr>
            </thead>
            <tbody id="allPointsTableBody">
              <tr>
                <td colspan="5" class="text-center text-muted py-5">Loading roll call points...</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  var allRollCallCache = window.allRollCallCache || [];

  function filterAllPointsSearch() {
    renderCombinedTable();
  }

  function renderCombinedTable() {
    const tbody = document.getElementById('allPointsTableBody');
    if (!tbody) return;

    const searchTerm = (document.getElementById('allPointsSearchInput')?.value || '').toLowerCase().trim();

    let filtered = allRollCallCache.filter(row => {
      if (searchTerm) {
        const text = [
          row.army_number,
          row.name,
          row.rank,
          row.company,
          row.point_title,
          row.point_description
        ].filter(Boolean).join(' ').toLowerCase();
        return text.includes(searchTerm);
      }
      return true;
    });

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5">No roll call points found</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map((row, index) => {
      const isSM = (row.category === 'SM_SUGGESTION');

      const personnelInfo = isSM
        ? '<div class="text-muted small"><i class="fa fa-user-shield me-1 text-warning"></i> <strong>SM ROLL CALL POINTS</strong></div>'
        : `<div>
            <span class="fw-bold text-dark">${row.name || '-'}</span>
            <div class="small text-muted">${row.rank || '-'} &bull; ${row.army_number || '-'} &bull; <span class="badge bg-secondary">${row.company || '-'}</span></div>
           </div>`;

      let formattedDate = '-';
      if (row.created_at) {
        const rcDt = new Date(row.created_at);
        if (!isNaN(rcDt.getTime())) {
          formattedDate = `${String(rcDt.getDate()).padStart(2, '0')}/${String(rcDt.getMonth() + 1).padStart(2, '0')}/${rcDt.getFullYear()}`;
        }
      }

      return `
        <tr>
          <td class="text-center fw-bold text-secondary">${index + 1}</td>
          <td>${personnelInfo}</td>
          <td class="fw-bold text-dark">${row.point_title || '-'}</td>
          <td>${row.point_description || '-'}</td>
          <td class="small text-muted">${formattedDate}</td>
        </tr>
      `;
    }).join('');
  }

  (function() {
    const modal = document.getElementById('centerRollCallModal');

    function updateRollCallLastTimestamp(ts) {
      if (!ts) return;
      document.querySelectorAll('.rollcall-last-updated-text, #rollCallLastUpdatedTimestamp').forEach(function(el) {
        el.textContent = ts;
      });
    }

    function fetchRollCallLastTimestamp() {
      fetch('/roll_call/last-timestamp')
        .then(res => res.json())
        .then(res => {
          if (res.status === 'success' && res.last_timestamp) {
            updateRollCallLastTimestamp(res.last_timestamp);
          }
        })
        .catch(() => {});
    }

    function fetchAllRollCallData() {
      const tbody = document.getElementById('allPointsTableBody');
      if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4"><i class="fa fa-spinner fa-spin me-2"></i> Loading all roll call points...</td></tr>';
      
      fetch('/roll_call/pending')
        .then(res => res.json())
        .then(res => {
          allRollCallCache = res.data || [];

          const badgeEl = document.getElementById('allPointsCountBadge');
          if (badgeEl) badgeEl.textContent = allRollCallCache.length;

          if (res.last_timestamp) {
            updateRollCallLastTimestamp(res.last_timestamp);
          }

          renderCombinedTable();
        })
        .catch(() => {
          if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Failed to load roll call points</td></tr>';
        });
    }

    if (modal) {
      modal.addEventListener('show.bs.modal', function() {
        fetchAllRollCallData();
        fetchRollCallLastTimestamp();
      });
    }

    // Initial fetch of timestamp
    fetchRollCallLastTimestamp();
  })();
</script>
