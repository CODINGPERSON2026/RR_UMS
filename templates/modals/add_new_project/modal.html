<!-- ================= CREATE PROJECT MODAL ================= -->
<div class="modal fade prj-detail-modal" id="prjCreateModal" tabindex="-1">
    <div class="modal-dialog modal-xl modal-dialog-centered" style="max-width: 1000px;">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header border-0 p-0">
                <div class="prj-detail-header w-100 d-flex justify-content-between align-items-center px-4 py-3">
                    <h3 class="prj-detail-title fs-5"><i class="fas fa-plus-circle me-2"></i>Create New Project</h3>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
            </div>

            <div class="modal-body prj-detail-body-content p-4">
                <form id="createProjectForm" onsubmit="event.preventDefault(); createNewProjectData();">
                    <div class="row g-3">

                        <!-- Title -->
                        <div class="col-md-5">
                            <label class="form-label fw-semibold mb-1">Project Title *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="fas fa-folder text-primary"></i></span>
                                <input type="text" id="newPrjTitle" class="form-control" placeholder="Enter project name..." required>
                                <div class="invalid-feedback">Project title is required</div>
                            </div>
                        </div>

                        <!-- Head -->
                        <div class="col-md-4">
                            <label class="form-label fw-semibold mb-1">Project Head *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="fas fa-user-shield text-primary"></i></span>
                                <input type="text" id="newPrjOwner" class="form-control" placeholder="Enter project head..." required>
                                <div class="invalid-feedback">Please enter a project head</div>
                            </div>
                        </div>

                        <!-- Cost -->
                        <div class="col-md-3">
                            <label class="form-label fw-semibold mb-1">Cost (₹) *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted fw-bold">₹</span>
                                <input type="number" id="newPrjCost" class="form-control" min="0" placeholder="e.g. 1500000" required>
                                <div class="invalid-feedback">Project cost is required</div>
                            </div>
                        </div>

                        <!-- Items -->
                        <div class="col-md-7">
                            <label class="form-label fw-semibold mb-1">Items / Category</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-muted"><i class="fas fa-boxes"></i></span>
                                <input type="text" id="newPrjItems" class="form-control" placeholder="e.g. Hardware Equipment">
                            </div>
                        </div>

                        <!-- Hidden Quantity Input (Auto-calculated from BOM) -->
                        <input type="hidden" id="newPrjQuantity" value="0">

                        <!-- BOM Toggle Button -->
                        <div class="col-md-5 d-flex align-items-end">
                            <button type="button" class="btn btn-outline-primary w-100 fw-semibold py-2" onclick="toggleBOMSection()">
                                <i class="fas fa-boxes me-2"></i>BILL OF MATERIAL
                            </button>
                        </div>

                        <!-- Description -->
                        <div class="col-12">
                            <label class="form-label fw-semibold mb-1">Description</label>
                            <textarea id="newPrjDescription" class="form-control" rows="2" placeholder="Enter project details..."></textarea>
                        </div>

                        <!-- Bill of Material Collapsible Section -->
                        <div class="col-12">
                            <div id="bomSection" class="card border-primary-subtle shadow-sm bg-white d-none">
                                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2 px-3">
                                    <span class="fw-bold small"><i class="fas fa-clipboard-list me-2"></i>Bill of Materials (BOM)</span>
                                    <button type="button" class="btn btn-sm btn-light text-primary fw-semibold px-3 py-1" onclick="addBOMRow()">
                                        <i class="fas fa-plus me-1"></i>Add Item
                                    </button>
                                </div>
                                <div class="card-body p-2">
                                    <div class="table-responsive" style="max-height: 200px; overflow-y: auto;">
                                        <table class="table table-sm table-hover table-bordered align-middle mb-0 bg-white" id="bomTable">
                                            <thead class="table-dark sticky-top">
                                                <tr class="text-center small">
                                                    <th style="min-width: 150px;">Nomenclature *</th>
                                                    <th style="min-width: 80px;">A/U</th>
                                                    <th style="min-width: 85px;">Qty</th>
                                                    <th style="min-width: 95px;">Rate (₹)</th>
                                                    <th style="min-width: 110px;">Total Cost (₹)</th>
                                                    <th style="width: 40px;"></th>
                                                </tr>
                                            </thead>
                                            <tbody id="bomTableBody">
                                                <!-- Dynamic Rows -->
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="d-flex justify-content-end align-items-center gap-3 mt-2 pe-2">
                                        <div>
                                            <span class="fw-bold small">Total BOM Qty: </span>
                                            <span id="bomGrandQty" class="fw-bold text-primary fs-6">0</span>
                                        </div>
                                        <div>
                                            <span class="fw-bold small">BOM Calculated Total: ₹</span>
                                            <span id="bomGrandTotal" class="fw-bold text-success fs-6">0.00</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Action Submit Button -->
                        <div class="col-12 mt-3 d-flex justify-content-end align-items-center gap-2">
                            <button type="button" class="btn btn-light border px-4" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="prj-update-button px-4 m-0">
                                <i class="fas fa-save me-2"></i>Create Project
                            </button>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>
  </div>
  
<script>
    function openCreateProjectModal() {

        const dashboardModal = bootstrap.Modal.getInstance(
          document.getElementById('projDash_modal')
        );
      
        if (dashboardModal) {
          dashboardModal.hide();
        }

        // Reset BOM section
        const bomSec = document.getElementById('bomSection');
        if (bomSec) bomSec.classList.add('d-none');
        const bomBody = document.getElementById('bomTableBody');
        if (bomBody) bomBody.innerHTML = '';
        const grandTot = document.getElementById('bomGrandTotal');
        if (grandTot) grandTot.innerText = '0.00';

        const createModal = new bootstrap.Modal(
          document.getElementById('prjCreateModal')
        );
      
        createModal.show();
      }

    function toggleBOMSection() {
      const bomSec = document.getElementById('bomSection');
      if (!bomSec) return;
      bomSec.classList.toggle('d-none');
      if (!bomSec.classList.contains('d-none')) {
        const bomBody = document.getElementById('bomTableBody');
        if (bomBody && bomBody.children.length === 0) {
          addBOMRow();
        }
      }
    }

    function addBOMRow(nomen = '', au = '', qty = 1, rate = 0) {
      const bomBody = document.getElementById('bomTableBody');
      if (!bomBody) return;

      const tr = document.createElement('tr');
      tr.className = 'align-middle';
      tr.innerHTML = `
        <td><input type="text" class="form-control form-control-sm bom-nomen" placeholder="Nomenclature" value="${nomen}" oninput="calculateBOMTotals()"></td>
        <td><input type="text" class="form-control form-control-sm bom-au" placeholder="A/U" value="${au}"></td>
        <td><input type="number" class="form-control form-control-sm bom-qty" min="0" value="${qty}" oninput="calculateBOMTotals()"></td>
        <td><input type="number" class="form-control form-control-sm bom-rate" min="0" step="0.01" value="${rate}" oninput="calculateBOMTotals()"></td>
        <td><input type="number" class="form-control form-control-sm bom-total bg-light" readonly value="0.00"></td>
        <td class="text-center"><button type="button" class="btn btn-sm btn-outline-danger border-0" onclick="removeBOMRow(this)" title="Remove item"><i class="fas fa-trash-alt"></i></button></td>
      `;
      bomBody.appendChild(tr);
      calculateBOMTotals();
    }

    function removeBOMRow(btn) {
      const row = btn.closest('tr');
      if (row) row.remove();
      calculateBOMTotals();
    }

    function calculateBOMTotals() {
      const rows = document.querySelectorAll('#bomTableBody tr');
      let grandTotal = 0;
      let grandQty = 0;

      rows.forEach(row => {
        const qtyEl = row.querySelector('.bom-qty');
        const rateEl = row.querySelector('.bom-rate');
        const totalEl = row.querySelector('.bom-total');

        const qty = parseFloat(qtyEl?.value) || 0;
        const rate = parseFloat(rateEl?.value) || 0;
        const total = qty * rate;

        if (totalEl) totalEl.value = total.toFixed(2);
        grandTotal += total;
        grandQty += qty;
      });

      const grandTotEl = document.getElementById('bomGrandTotal');
      if (grandTotEl) grandTotEl.innerText = grandTotal.toFixed(2);

      const grandQtyEl = document.getElementById('bomGrandQty');
      if (grandQtyEl) grandQtyEl.innerText = grandQty;

      // Auto-update hidden project quantity input
      const qtyInput = document.getElementById('newPrjQuantity');
      if (qtyInput) qtyInput.value = grandQty;
    }

    async function createNewProjectData() {

  const titleEl = document.getElementById('newPrjTitle');
  const ownerEl = document.getElementById('newPrjOwner');
  const costEl = document.getElementById('newPrjCost');

  const itemsEl = document.getElementById('newPrjItems');
  const quantityEl = document.getElementById('newPrjQuantity');
  const descriptionEl = document.getElementById('newPrjDescription');

  const project_name = titleEl.value.trim();
  const head = ownerEl.value.trim();
  const project_cost = costEl.value.trim();

  const project_items = itemsEl.value.trim();
  const quantity = quantityEl.value.trim();
  const project_description = descriptionEl.value.trim();

  // Collect Bill of Material items
  const bomRows = document.querySelectorAll('#bomTableBody tr');
  const bom_items = [];
  bomRows.forEach(row => {
    const nomenclature = row.querySelector('.bom-nomen')?.value.trim() || '';
    const au = row.querySelector('.bom-au')?.value.trim() || '';
    const qty = parseFloat(row.querySelector('.bom-qty')?.value) || 0;
    const rate = parseFloat(row.querySelector('.bom-rate')?.value) || 0;
    const total_cost = parseFloat(row.querySelector('.bom-total')?.value) || (qty * rate);

    if (nomenclature) {
      bom_items.push({ nomenclature, au, qty, rate, total_cost });
    }
  });

  // reset validation
  [titleEl, ownerEl, costEl].forEach(el => {
    el.classList.remove("is-invalid");
  });

  let isValid = true;

  if (!project_name) {
    titleEl.classList.add("is-invalid");
    isValid = false;
  }

  if (!head) {
    ownerEl.classList.add("is-invalid");
    isValid = false;
  }

  if (!project_cost || parseFloat(project_cost) < 0) {
    costEl.classList.add("is-invalid");
    isValid = false;
  }

  if (!isValid) return;

  const btn = document.querySelector("#prjCreateModal .prj-update-button");
  btn.innerHTML = `<i class="fas fa-spinner fa-spin me-2"></i>Creating...`;
  btn.disabled = true;

  try {

    const response = await fetch('/projects/create', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({

        project_name,
        head,
        project_cost,
        project_items,
        quantity,
        project_description,
        bom_items,

        // optional default fields
        status: "Active",
        current_stage: "Planning"

      })
    });

    const result = await response.json();

    if (result.status === 'success') {

      btn.innerHTML = `<i class="fas fa-check me-2"></i>Created`;

      setTimeout(() => {

        bootstrap.Modal.getInstance(
          document.getElementById('prjCreateModal')
        ).hide();

        if (typeof loadAllProjectsData === 'function') {
          loadAllProjectsData();
        } else {
          location.reload();
        }

        btn.innerHTML = `<i class="fas fa-save me-2"></i>Create Project`;
        btn.disabled = false;

      }, 800);

    } else {
      showCreateError(result.message || "Creation failed");
      btn.innerHTML = `<i class="fas fa-save me-2"></i>Create Project`;
      btn.disabled = false;
    }

  } catch (error) {
    console.error(error);
    showCreateError("Server error");
    btn.innerHTML = `<i class="fas fa-save me-2"></i>Create Project`;
    btn.disabled = false;
  }
}
      function showCreateError(message) {

        const body = document.querySelector("#prjCreateModal .modal-body");
      
        const errorDiv = document.createElement("div");
        errorDiv.className = "alert alert-danger mt-3";
        errorDiv.innerText = message;
      
        body.prepend(errorDiv);
      
        setTimeout(() => errorDiv.remove(), 3000);
      }
                  
</script>
