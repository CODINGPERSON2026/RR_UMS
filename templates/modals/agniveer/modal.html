<!-- ===================== AGNIVEER MODAL ===================== -->
<div class="modal fade" id="agni_Modal" tabindex="-1">
  <div class="modal-dialog modal-fullscreen modal-dialog-scrollable">
    <div class="modal-content overflow-hidden">
      <!-- HEADER — compact light -->
      <div class="modal-header bg-white border-bottom d-flex justify-content-between align-items-center py-2 px-3">
        <h6 class="modal-title fw-bold text-dark mb-0 d-flex align-items-center">
          <i class="bi bi-shield-fill-check text-primary me-2 fs-5"></i>
          <span></span>
        </h6>
        <div class="d-flex gap-2 align-items-center">
          <button type="button" class="btn btn-outline-secondary btn-sm fw-semibold d-inline-flex align-items-center gap-1 shadow-none" onclick="agni_printTable()">
            <i class="bi bi-printer-fill"></i> Print
          </button>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
      </div>
      <div class="text-center py-2 d-flex justify-content-center align-items-center gap-2 flex-wrap" style="background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
        <span class="badge" style="background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; font-size: 12px; font-weight: 700; padding: 5px 16px; border-radius: 30px; letter-spacing: 0.5px;">
          <i class="fa fa-user-shield me-1 text-primary"></i> UPDATED BY TRGJCO
        </span>
        <span class="badge" id="agniLastUpdatedBadge" style="background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; font-size: 12px; font-weight: 700; padding: 5px 16px; border-radius: 30px; letter-spacing: 0.5px;">
          <i class="fa fa-clock me-1 text-primary"></i> LAST UPDATED: <span id="agniLastUpdatedTimestamp" class="agni-last-updated-text">--</span>
        </span>
      </div>

      <div class="modal-body pt-2 pb-2">

        <!-- Batch Filter & Quick Search — compact -->
        <div class="row mb-2 g-2">
          <div class="col-md-5">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light text-secondary border-end-0 fw-semibold">
                <i class="bi bi-funnel me-1 text-primary"></i>Batch
              </span>
              <select id="agni_BatchFilter" class="form-select form-select-sm border-start-0">
                <option value="all">All Batches</option>
              </select>
              <button id="agni_ResetFilter" class="btn btn-outline-secondary btn-sm" type="button">
                Reset
              </button>
            </div>
          </div>
          <div class="col-md-4">
            <div class="input-group input-group-sm">
              <span class="input-group-text bg-light text-secondary border-end-0">
                <i class="bi bi-search text-muted"></i>
              </span>
              <input type="text" id="agni_SearchInput" class="form-control form-control-sm border-start-0" placeholder="Search batch or board...">
            </div>
          </div>
        </div>

        <!-- TABLE -->
        <div class="table-responsive">
          <table class="table table-bordered table-hover align-middle text-center mb-0">
            <thead class="agni_tableHead">
              <tr>
                <th rowspan="2">Batch</th>
                <th rowspan="2">DOE</th>
                <th rowspan="2">TOE</th>
                <th rowspan="2">STR</th>
                <th colspan="2">TENURE (20 MONTHS)</th>
                <th colspan="4">Timelines for Asst from DOE</th>
                <th colspan="4">Assmt completed on / or such wef</th>
                <th rowspan="2">Screening Board</th>
                <th rowspan="2">Remarks</th>
              </tr>
              <tr>
                <th>From</th>
                <th>To</th>
                <th>12 Mo</th>
                <th>18 Mo</th>
                <th>30 Mo</th>
                <th>42 Mo</th>
                <th>1st Yr</th>
                <th>2nd Yr</th>
                <th>3rd Yr</th>
                <th>4th Yr</th>
              </tr>
            </thead>
            <tbody id="agni_TableBody">
              <tr>
                <td colspan="16" class="text-center text-muted py-3">No records found</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div><!-- /modal-body -->

      <div class="modal-footer py-2 bg-light border-top">
        <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>
<!-- ===================== END AGNIVEER MODAL ===================== -->


<!-- ===================== REMARKS SIDE PANEL (plain div — no Bootstrap offcanvas JS) ===================== -->
<div id="agni_RemarksPanel" style="
     position:fixed; top:0; right:-420px; width:400px; height:100%;
     z-index:1070; display:flex; flex-direction:column;
     background:#fff; box-shadow:-4px 0 24px rgba(0,0,0,0.12);
     transition: right 0.28s cubic-bezier(0.4,0,0.2,1);
     overflow:hidden; border-left: 1px solid #e2e8f0;">

  <!-- Panel header (Light) -->
  <div style="background:#f8fafc;
              color:#1e293b; padding:12px 16px;
              border-bottom:1px solid #e2e8f0;
              display:flex; align-items:center; justify-content:space-between;
              flex-shrink:0;">
    <div>
      <div style="font-weight:700; font-size:0.92rem; color:#1e293b;">
        <i class="bi bi-chat-square-text-fill me-1 text-primary"></i>Remarks
      </div>
      <div id="agni_RemarksMeta" style="color:#64748b; font-size:0.75rem; margin-top:2px;"></div>
    </div>
    <!-- plain button — no Bootstrap dismiss, just calls agni_closeRemarks() -->
    <button onclick="agni_closeRemarks()"
            style="background:none; border:none; color:#64748b; font-size:1.3rem;
                   cursor:pointer; line-height:1; padding:2px 6px;"
            title="Close">&times;</button>
  </div>

  <!-- Scrollable body -->
  <div id="agni_RemarksBody" style="flex:1; overflow-y:auto; padding:0;"></div>

</div>
<!-- ===================== END REMARKS SIDE PANEL ===================== -->

<!-- ===================== SCRIPT ===================== -->
<script>
(function () {
  'use strict';

  let agni_allData   = [];
  let agni_isLoaded  = false;
  let agni_isLoading = false;

  /* ── Helper to standardize batch display ───────── */
  function agni_formatBatchName(b) {
    if (!b) return '';
    let str = String(b).trim();
    if (/^\d+$/.test(str)) return 'Batch ' + str;
    return str.replace(/\b\w+/g, function (txt) {
      return txt.charAt(0).toUpperCase() + txt.slice(1).toLowerCase();
    });
  }

  /* ── Helper to update timestamp ──────────────────── */
  function agni_updateLastTimestamp(ts) {
    if (!ts) return;
    document.querySelectorAll('.agni-last-updated-text, #agniLastUpdatedTimestamp').forEach(function (el) {
      el.textContent = ts;
    });
  }

  /* ── Fetch Last Updated ───────────────────────────── */
  window.agni_fetchLastUpdated = function () {
    fetch('/agni/get_last_updated')
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.status === 'success' && res.last_updated && res.last_updated !== 'N/A') {
          agni_updateLastTimestamp(res.last_updated);
        }
      })
      .catch(function () {});
  };

  /* ── Modal open listener ──────────────────────────── */
  document.getElementById('agni_Modal')?.addEventListener('shown.bs.modal', function () {
    if (typeof window.agni_fetchLastUpdated === 'function') {
      window.agni_fetchLastUpdated();
    }
    if (agni_isLoading) return;
    agni_loadData();
  });

  /* ── Fetch in parallel ────────────────────────────── */
  function agni_loadData() {
    agni_isLoading = true;
    agni_showSpinner();
    Promise.all([
      fetch('/agni/get_batches').then(function (r) { return r.json(); }),
      fetch('/agni/get_all_agniveers').then(function (r) { return r.json(); }),
      fetch('/agni/get_last_updated').then(function (r) { return r.json(); }).catch(function () { return null; })
    ])
    .then(function ([batches, records, lastUp]) {
      agni_allData   = records || [];
      if (lastUp && lastUp.last_updated && lastUp.last_updated !== 'N/A') {
        agni_updateLastTimestamp(lastUp.last_updated);
      }
      agni_populateBatchFilter(batches);
      agni_isLoaded  = true;
      agni_isLoading = false;
      agni_applyFilters();
    })
    .catch(function (err) {
      agni_isLoading = false;
      agni_showError(err);
    });
  }

  /* ── Batch dropdown ───────────────────────────────── */
  function agni_populateBatchFilter(batches) {
    const sel = document.getElementById('agni_BatchFilter');
    if (!sel) return;
    const cur = sel.value;

    const dataBatches = (agni_allData || []).map(b => b.batch).filter(Boolean);
    const rawCombined = [...(batches || []), ...dataBatches];

    // Standardize all batch entries to clean Title Case (e.g. "Batch 1")
    const formattedMap = new Map();
    rawCombined.forEach(b => {
      if (!b) return;
      const fmt = agni_formatBatchName(b);
      if (fmt) formattedMap.set(fmt.toLowerCase(), fmt);
    });

    const combined = Array.from(formattedMap.values()).sort((a, b) =>
      a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })
    );

    sel.innerHTML = '<option value="all">All Batches</option>' +
      combined.map(b => `<option value="${b}">${b}</option>`).join('');

    if (cur && combined.some(c => c.toLowerCase() === cur.toLowerCase())) {
      sel.value = combined.find(c => c.toLowerCase() === cur.toLowerCase());
    } else {
      sel.value = 'all';
    }
  }

  /* ── Filter ───────────────────────────────────────── */
  function agni_applyFilters() {
    const sel = document.getElementById('agni_BatchFilter');
    const searchInp = document.getElementById('agni_SearchInput');

    const rawSel = sel ? String(sel.value || 'all').trim() : 'all';
    const selectedBatchFmt = agni_formatBatchName(rawSel).toLowerCase();
    const query = searchInp ? String(searchInp.value || '').trim().toLowerCase() : '';

    let filtered = agni_allData || [];

    if (rawSel !== 'all' && selectedBatchFmt !== 'all batches') {
      filtered = filtered.filter(function (a) {
        const itemFmt = agni_formatBatchName(a.batch).toLowerCase();
        if (!itemFmt) return false;

        if (itemFmt === selectedBatchFmt) return true;

        // Strip non-digits for numeric comparison (e.g. "batch 1" -> 1)
        const numItem = parseInt(itemFmt.replace(/\D+/g, ''), 10);
        const numSel  = parseInt(selectedBatchFmt.replace(/\D+/g, ''), 10);
        if (!isNaN(numItem) && !isNaN(numSel) && numItem === numSel) return true;

        if (itemFmt.includes(selectedBatchFmt) || selectedBatchFmt.includes(itemFmt)) return true;

        return false;
      });
    }

    if (query) {
      filtered = filtered.filter(function (a) {
        const batchMatch = String(a.batch || '').toLowerCase().includes(query);
        const boardMatch = String(a.screening_board || '').toLowerCase().includes(query);
        const remarksMatch = String(a.remarks || '').toLowerCase().includes(query);
        return batchMatch || boardMatch || remarksMatch;
      });
    }

    agni_renderTable(filtered);
  }

  /* ── Render rows ──────────────────────────────────── */
  function agni_renderTable(data) {
    const tbody = document.getElementById('agni_TableBody');
    if (!data.length) {
      tbody.innerHTML =
        '<tr><td colspan="16" class="text-center text-muted py-3">No records found</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(function (p, i) {
      const parts      = p.remarks ? p.remarks.split('|').map(r => r.trim()).filter(Boolean) : [];
      const hasRemarks = parts.length > 0;
      const btn = hasRemarks
        ? `<button class="agni_viewRemarksBtn" onclick="agni_openRemarks(${i})">
             <i class="bi bi-chat-square-text-fill"></i>
             View Remarks
             <span class="agni_countPill">${parts.length}</span>
           </button>`
        : `<button class="agni_viewRemarksBtn agni_disabled" disabled>
             <i class="bi bi-chat-square"></i> No Remarks
           </button>`;
      return `
        <tr class="agni_row${(i % 5) + 1}">
          <td><span class="badge" style="background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd; font-weight:600; font-size:0.8rem; padding:4px 8px;">${p.batch}</span></td>
          <td>${agni_fmtMY(p.DOE)}</td>
          <td>${agni_fmtMY(p.TOE)}</td>
          <td>${p.strength}</td>
          <td>${agni_fmtMY(p.TOS)}</td>
          <td>${agni_fmtMY(p.END_OF_TENURE)}</td>
          <td>${agni_testCell(p.asst_test1, p.test1_status)}</td>
          <td>${agni_testCell(p.asst_test2, p.test2_status)}</td>
          <td>${agni_testCell(p.asst_test3, p.test3_status)}</td>
          <td>${agni_testCell(p.asst_test4, p.test4_status)}</td>
          <td>${agni_fmtFull(p.assmt_wef_1st)}</td>
          <td>${agni_fmtFull(p.assmt_wef_2nd)}</td>
          <td>${agni_fmtFull(p.assmt_wef_3rd)}</td>
          <td>${agni_fmtFull(p.assmt_wef_4th)}</td>
          <td class="text-start">${p.screening_board || '<span class="text-muted">—</span>'}</td>
          <td>${btn}</td>
        </tr>`;
    }).join('');
  }

  /* ── Open remarks — pure CSS slide, zero Bootstrap JS ── */
  window.agni_openRemarks = function (index) {
    const p = agni_allData[index];
    if (!p) return;

    document.getElementById('agni_RemarksMeta').textContent =
      'Batch: ' + p.batch + '  ·  Strength: ' + p.strength;

    const parts = p.remarks
      ? p.remarks.split('|').map(function(r){ return r.trim(); }).filter(Boolean)
      : [];

    const body = document.getElementById('agni_RemarksBody');

    if (!parts.length) {
      body.innerHTML =
        '<div class="agni_noRemarks">' +
          '<i class="bi bi-chat-square"></i>' +
          '<span>No remarks recorded</span>' +
        '</div>';
    } else {
      body.innerHTML = '<div class="agni_remarksScroll">' +
        parts.map(function (remark, i) {
          return '<div class="agni_remarkCard agni_rc' + ((i % 8) + 1) + '">' +
            '<div class="agni_remarkCard-hdr">' +
              '<span class="agni_num">' + (i + 1) + '</span>' +
              'Remark ' + (i + 1) +
            '</div>' +
            '<div class="agni_remarkCard-body">' + remark + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
    }

    /* Slide in — just move the right offset to 0 */
    document.getElementById('agni_RemarksPanel').style.right = '0';
  };

  /* ── Close remarks — slide back out, no Bootstrap involved ── */
  window.agni_closeRemarks = function () {
    document.getElementById('agni_RemarksPanel').style.right = '-420px';
  };

  /* ── Helpers ──────────────────────────────────────── */
  function agni_fmtMY(d) {
    if (!d) return '<span class="text-muted">—</span>';
    return new Date(d).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
  }
  function agni_fmtFull(d) {
    if (!d) return '<span class="text-muted">—</span>';
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return `<strong>${d}</strong>`;
    const day = String(dt.getDate()).padStart(2, '0');
    const month = String(dt.getMonth() + 1).padStart(2, '0');
    const year = dt.getFullYear();
    return `<strong>${day}/${month}/${year}</strong>`;
  }
  function agni_testCell(date, status) {
    if (!date) return '<span class="text-muted">—</span>';
    const badge = status === 1
      ? '<span class="badge" style="background:#dcfce7; color:#15803d; border:1px solid #bbf7d0; font-weight:700; margin-left:4px;">✓</span>'
      : '<span class="badge" style="background:#fef3c7; color:#b45309; border:1px solid #fde68a; font-weight:700; margin-left:4px;">P</span>';
    return `<span class="fw-semibold">${agni_fmtMY(date)}</span>${badge}`;
  }

  /* ── Spinner / Error ──────────────────────────────── */
  function agni_showSpinner() {
    document.getElementById('agni_TableBody').innerHTML = `
      <tr><td colspan="16" class="text-center py-4">
        <div class="spinner-border spinner-border-sm me-2" role="status"></div>Loading data…
      </td></tr>`;
  }
  function agni_showError(err) {
    console.error('Agniveer load error:', err);
    document.getElementById('agni_TableBody').innerHTML = `
      <tr><td colspan="16" class="text-center text-danger py-3">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>Failed to load data. Please close and reopen.
      </td></tr>`;
  }

  /* ── Print ────────────────────────────────────────── */
  window.agni_printTable = function () { window.print(); };

  /* ── Filter listeners ─────────────────────────────── */
  document.getElementById('agni_BatchFilter')?.addEventListener('change', agni_applyFilters);
  document.getElementById('agni_SearchInput')?.addEventListener('input', agni_applyFilters);
  document.getElementById('agni_ResetFilter')?.addEventListener('click', function () {
    const sel = document.getElementById('agni_BatchFilter');
    const searchInp = document.getElementById('agni_SearchInput');
    if (sel) sel.value = 'all';
    if (searchInp) searchInp.value = '';
    agni_applyFilters();
  });

})();
</script>
<!-- ===================== END SCRIPT ===================== -->
