
  <style>
    /* ================= ROOT (SCOPED) ================= */
    .leave-module {
      --clr-bg: #f0f4f8;
      --clr-surface: #ffffff;
      --clr-card: #f7f9fc;
      --clr-border: rgba(0,0,0,0.08);
      --clr-header-bg: #1e40af;
      --clr-header-bg2: #1d4ed8;
      --clr-accent-green: #059669;
      --clr-accent-amber: #d97706;
      --clr-accent-blue: #1e40af;
      --clr-text: #111827;
      --clr-muted: #6b7280;
      --radius: 16px;
    }

    /* ================= MODAL ================= */
    .leave-module .modal-content {
      background: var(--clr-surface);
      border: 1px solid var(--clr-border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .leave-module .modal-dialog { max-width: 880px; }

    /* HEADER */
    .leave-module .modal-header {
      background: linear-gradient(135deg, var(--clr-header-bg), var(--clr-header-bg2));
      border-bottom: none;
      padding: 22px 28px 0;
      flex-direction: column;
      color: white;
    }
    .leave-module .modal-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }
    .leave-module .modal-title { 
      color: #fff; 
      font-weight: 800; 
      font-size: 1.5rem;
    }
    .leave-module .modal-subtitle { 
      color: rgba(255,255,255,0.75); 
      font-size: 0.95rem;
    }

    /* CLOSE BUTTON */
    .leave-module .btn-close-custom {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      color: rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .leave-module .btn-close-custom:hover {
      background: rgba(255,255,255,0.1);
    }

    /* ================= TABS ================= */
    .leave-module .leave-tabs {
      display: flex;
      gap: 4px;
      width: 100%;
      background: rgba(255,255,255,0.1);
      padding: 4px;
      border-radius: 12px 12px 0 0;
    }

    .leave-module .leave-tab-btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: rgba(255,255,255,0.75);
      padding: 14px 20px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .leave-module .leave-tab-btn.active {
      background: #fff;
      color: #1e40af;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .leave-module .tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 2px 8px;
      font-size: 0.8rem;
      font-weight: 700;
      border-radius: 999px;
      line-height: 1;
      margin-left: 6px;
      transition: all 0.25s ease;
    }

    /* Inactive Tab Badge */
    .leave-module .leave-tab-btn .tab-badge {
      background: rgba(255, 255, 255, 0.22) !important;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.35) !important;
      box-shadow: none !important;
    }

    .leave-module .leave-tab-btn:hover:not(.active) .tab-badge {
      background: rgba(255, 255, 255, 0.32) !important;
      color: #ffffff !important;
    }

    /* Active Tab Badge */
    .leave-module .leave-tab-btn.active .tab-badge {
      background: #1e40af !important;
      color: #ffffff !important;
      border: 1px solid #1e40af !important;
      box-shadow: 0 2px 4px rgba(30, 64, 175, 0.25) !important;
    }

    /* ================= BODY ================= */
    .leave-module .modal-body {
      padding: 24px 28px;
      background: var(--clr-surface);
    }

    /* Tab Panels - IMPORTANT FIX */
    .leave-module .tab-panel {
      display: none;
    }
    .leave-module .tab-panel.active {
      display: block;
    }

    /* ================= TABLE ================= */
    .leave-module .table-wrap {
      border-radius: 12px;
      border: 1px solid var(--clr-border);
      overflow-x: auto;
      background: white;
    }

    .leave-module .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .leave-module .table-wrap thead tr {
      background: var(--clr-card);
    }

    .leave-module .table-wrap thead th {
      font-size: 0.75rem;
      color: var(--clr-muted);
      padding: 14px 16px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .leave-module .table-wrap tbody td {
      padding: 14px 16px;
      color: var(--clr-text);
      vertical-align: middle;
    }

    .leave-module .table-wrap tbody tr:hover {
      background: #f0f9ff;
    }

    /* ================= BADGES & CHIPS ================= */
    .leave-module .badge-pill {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .leave-module .badge-approved {
      background: #d1fae5;
      color: #065f46;
    }

    .leave-module .badge-type {
      background: #eff6ff;
      color: #1e40af;
    }

    .leave-module .pending-at-chip {
      font-size: 0.8rem;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 6px 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* ================= EMPLOYEE CELL ================= */
    .leave-module .emp-cell {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .leave-module .emp-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .leave-module .emp-name { font-weight: 600; }
    .leave-module .emp-id { font-size: 0.75rem; color: var(--clr-muted); }

    /* ================= DATE RANGE ================= */
    .leave-module .date-range {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
    }
    .leave-module .date-arrow { color: var(--clr-muted); }

    /* ================= FOOTER ================= */
    .leave-module .modal-footer {
      background: var(--clr-card);
      border-top: 1px solid var(--clr-border);
      padding: 16px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ================= SPINNER & EMPTY ================= */
    .leave-module .spinner-wrap {
      padding: 60px 20px;
      text-align: center;
      color: var(--clr-muted);
    }

    .leave-module .spinner-ring {
      width: 24px;
      height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      display: inline-block;
      margin-bottom: 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .leave-module .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--clr-muted);
    }
    .leave-module .empty-state i {
      font-size: 3rem;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    /* Avatar Colors */
    .leave-module .av0 { background: #ede9fe; color: #5b21b6; }
    .leave-module .av1 { background: #d1fae5; color: #065f46; }
    .leave-module .av2 { background: #fef3c7; color: #92400e; }
    .leave-module .av3 { background: #fce7f3; color: #9d174d; }
    .leave-module .av4 { background: #dbeafe; color: #1e40af; }
  </style>

  <div class="leave-module">
    <!-- MODAL -->
    <div class="modal fade" id="leaveModal" tabindex="-1" aria-labelledby="leaveModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">

          <!-- Blue Header -->
          <div class="modal-header">
            <div class="modal-header-top">
              <div style="display: flex; align-items: center; gap: 12px;">
                <div style="font-size: 1.8rem;">🗓️</div>
                <div>
                  <div class="modal-title" id="leaveModalLabel">Leave Status</div>
                  <div class="modal-subtitle" id="modalSubtitle">Loading data…</div>
                </div>
              </div>
              <button class="btn-close-custom" onclick="closeLeaveModal()" aria-label="Close">
                <i class="bi bi-x-lg">X</i>
              </button>
            </div>

            <!-- Tabs -->
            <div class="leave-tabs">
              <button class="leave-tab-btn active" id="tab-btn-approved" data-tab="approved" onclick="switchLeaveModalTab('approved')">
                <i class="bi bi-check-circle-fill"></i> Approved
                <span class="tab-badge" id="approved-count">0</span>
              </button>
              <button class="leave-tab-btn" id="tab-btn-pending" data-tab="pending" onclick="switchLeaveModalTab('pending')">
                <i class="bi bi-clock-fill"></i> Pending
                <span class="tab-badge" id="pending-count">0</span>
              </button>
            </div>
          </div>

          <!-- Body -->
          <div class="modal-body">

            <!-- Approved Panel -->
            <div class="tab-panel active" id="panel-approved">
              <div class="table-toolbar mb-3 d-flex justify-content-between align-items-center">
                <div class="search-wrap" style="position: relative; width: 320px;">
                  <i class="bi bi-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280;"></i>
                  <input type="text" class="form-control ps-5" placeholder="Search by name or type…" 
                         oninput="filterLeaveModalTable('approved', this.value)" id="search-approved">
                </div>
                <div class="result-count text-muted small" id="rc-approved">— records</div>
              </div>

              <div class="table-wrap">
                <div class="spinner-wrap" id="spinner-approved">

                <table id="table-approved" style="display: none;">
                  <thead>
                    <tr>
                      <th>Employee</th>

                  </thead>
                  <tbody id="tbody-approved"></tbody>
                </table>
                <div class="empty-state" id="empty-approved" style="display: none;">
                  <i class="bi bi-inbox"></i>
                  <p>No approved leaves found.</p>
                </div>
              </div>
            </div>

            <!-- Pending Panel -->
            <div class="tab-panel" id="panel-pending">
              <div class="table-toolbar mb-3 d-flex justify-content-between align-items-center">
                <div class="search-wrap" style="position: relative; width: 320px;">
                  <i class="bi bi-search" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #6b7280;"></i>
                  <input type="text" class="form-control ps-5" placeholder="Search by name or type…" 
                         oninput="filterLeaveModalTable('pending', this.value)" id="search-pending">
                </div>
                <div class="result-count text-muted small" id="rc-pending">— records</div>
              </div>

              <div class="table-wrap">
                <div class="spinner-wrap" id="spinner-pending">
                  <div class="spinner-ring"></div>
                  <div>Fetching pending leaves…</div>
                </div>
                <table id="table-pending" style="display: none;">
                  <thead>
                    <tr>
                      <th>Employee</th>
                      <th>Leave Type</th>
                      <th>Duration</th>
                      <th>Days</th>
                      <th>Pending At</th>
                    </tr>
                  </thead>
                  <tbody id="tbody-pending"></tbody>
                </table>
                <div class="empty-state" id="empty-pending" style="display: none;">

                  <p>No pending leaves found.</p>

          </div>

          <!-- Footer -->
          <div class="modal-footer">
            <div class="footer-meta text-muted small" id="footer-meta">Last synced just now</div>
            <button class="btn btn-primary btn-sm px-4" onclick="exportLeaveModalCSV()">
              <i class="bi bi-download me-2"></i> Export CSV
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  
  <script>
    const API_URL = '/apply_leave/api/leaves';
    let allData = { approved: [], pending: [] };
    let currentTab = 'approved';
    let modalInstance = null;

    const AVATAR_COLORS = ['av0', 'av1', 'av2', 'av3', 'av4'];

    function initials(name) {
      if (!name || typeof name !== 'string') return '?';
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      return parts.slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
    }

    function daysBetween(d1, d2) {
      try {
        if (!d1 || !d2 || d1 === '-' || d2 === '-' || d1 === '–' || d2 === '–') return '-';
        const parse = s => {
          if (!s) return null;
          if (s instanceof Date) return s;
          const str = String(s).trim();
          const dmyMatch = str.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);
          if (dmyMatch) {
            const [, d, m, y] = dmyMatch;
            return new Date(Number(y), Number(m) - 1, Number(d));
          }
          const ymdMatch = str.match(/^(\d{4})[/-](\d{1,2})[/-](\d{1,2})$/);
          if (ymdMatch) {
            const [, y, m, d] = ymdMatch;
            return new Date(Number(y), Number(m) - 1, Number(d));
          }
          const dt = new Date(str);
          return isNaN(dt.getTime()) ? null : dt;
        };

        const dt1 = parse(d1);
        const dt2 = parse(d2);
        if (!dt1 || !dt2 || isNaN(dt1.getTime()) || isNaN(dt2.getTime())) {
          return '-';
        }
        const diffDays = Math.round(Math.abs(dt2 - dt1) / 86400000) + 1;
        return isNaN(diffDays) ? '-' : diffDays;
      } catch (e) {
        return '-';
      }
    }

    function buildApprovedRow(r) {
      try {
        const rawName = r.employee_name || r.name || 'Unknown';
        const name = String(rawName).trim();
        const rank = r.rank ? String(r.rank).trim() + ' ' : '';
        const armyNumber = r.army_number || r.employee_id || r.emp_id || '';
        const ltype = r.leave_type || r.type || '-';
        const from = r.from_date || r.start_date || '-';
        const to = r.to_date || r.end_date || '-';
        const avClass = AVATAR_COLORS[(name.charCodeAt(0) || 0) % AVATAR_COLORS.length];
        const days = (r.leave_days !== null && r.leave_days !== undefined && r.leave_days !== '' && !isNaN(r.leave_days))
          ? r.leave_days
          : ((from !== '-' && to !== '-') ? daysBetween(from, to) : '-');
        const get_leave_id = r.id;

        return `
          <tr data-search="${(name + ' ' + armyNumber + ' ' + ltype).toLowerCase()}">
            <td>
              <div class="emp-cell">
                <div class="emp-avatar ${avClass}">${initials(name)}</div>
                <div>
                  <div class="emp-name">${rank}${name}</div>
                  ${armyNumber ? `<div class="emp-id">#${armyNumber}</div>` : ''}
                </div>
              </div>
            </td>
            <td><span class="badge-pill badge-type">${ltype}</span></td>
            <td><div class="date-range"><span>${from}</span><span class="date-arrow">→</span><span>${to}</span></div></td>
            <td><strong>${days}</strong><small class="text-muted"> days</small></td>
            <td><span class="badge-pill badge-approved"><i class="bi bi-check-circle"></i> Approved</span></td>
            <td>
              <button class="btn btn-sm btn-outline-primary"
                  onclick="downloadLeaveCertificate('${get_leave_id}')"
                  title="Download Certificate">
                  <i class="fa-solid fa-download"></i>
              </button>
            </td>
          </tr>`;
      } catch (err) {
        console.error('buildApprovedRow error:', err, r);
        return '';
      }
    }

    function buildPendingRow(r) {
      try {
        const rawName = r.employee_name || r.name || 'Unknown';
        const name = String(rawName).trim();
        const rank = r.rank ? String(r.rank).trim() + ' ' : '';
        const armyNumber = r.army_number || r.employee_id || r.emp_id || '';
        const ltype = r.leave_type || r.type || '-';
        const from = r.from_date || r.start_date || '-';
        const to = r.to_date || r.end_date || '-';
        const pendingAt = r.request_status || 'Pending';
        const avClass = AVATAR_COLORS[(name.charCodeAt(0) || 0) % AVATAR_COLORS.length];
        const days = (r.leave_days !== null && r.leave_days !== undefined && r.leave_days !== '' && !isNaN(r.leave_days))
          ? r.leave_days
          : ((from !== '-' && to !== '-') ? daysBetween(from, to) : '-');

        return `
          <tr data-search="${(name + ' ' + armyNumber + ' ' + ltype + ' ' + pendingAt).toLowerCase()}">
            <td>
              <div class="emp-cell">
                <div class="emp-avatar ${avClass}">${initials(name)}</div>
                <div>
                  <div class="emp-name">${rank}${name}</div>
                  ${armyNumber ? `<div class="emp-id">#${armyNumber}</div>` : ''}
                </div>
              </div>
            </td>
            <td><span class="badge-pill badge-type">${ltype}</span></td>
            <td><div class="date-range"><span>${from}</span><span class="date-arrow">→</span><span>${to}</span></div></td>
            <td><strong>${days}</strong><small class="text-muted"> days</small></td>
            <td><span class="pending-at-chip"><i class="bi bi-hourglass-split"></i> ${pendingAt}</span></td>
          </tr>`;
      } catch (err) {
        console.error('buildPendingRow error:', err, r);
        return '';
      }
    }

    function renderSanctionLeaveTable(type, rows) {
      const tbody = document.getElementById(`tbody-${type}`);
      const table = document.getElementById(`table-${type}`);
      const spinner = document.getElementById(`spinner-${type}`);
      const empty = document.getElementById(`empty-${type}`);
      const rc = document.getElementById(`rc-${type}`);

      if (spinner) spinner.style.display = 'none';

      if (!rows || rows.length === 0) {
        if (table) table.style.display = 'none';
        if (empty) empty.style.display = 'block';
        if (rc) rc.textContent = '0 records';
        if (tbody) tbody.innerHTML = '';
        return;
      }

      try {
        const rowsHtml = rows.map(r => type === 'approved' ? buildApprovedRow(r) : buildPendingRow(r)).join('');
        if (tbody) tbody.innerHTML = rowsHtml;
        if (table) table.style.display = 'table';
        if (empty) empty.style.display = 'none';
        if (rc) rc.textContent = `${rows.length} record${rows.length !== 1 ? 's' : ''}`;
      } catch (err) {
        console.error(`Error rendering table for ${type}:`, err);
        if (table) table.style.display = 'table';
        if (empty) empty.style.display = 'none';
      }
    }

    function filterLeaveModalTable(type, query) {
      const tbody = document.getElementById(`tbody-${type}`);
      if (!tbody) return;
      const rows = tbody.querySelectorAll('tr');
      const q = (query || '').toLowerCase().trim();
      let visible = 0;

      rows.forEach(tr => {
        const match = !q || (tr.dataset.search && tr.dataset.search.includes(q));
        tr.style.display = match ? '' : 'none';
        if (match) visible++;
      });

      const rc = document.getElementById(`rc-${type}`);
      if (rc) rc.textContent = `${visible} record${visible !== 1 ? 's' : ''}`;

      const empty = document.getElementById(`empty-${type}`);
      const table = document.getElementById(`table-${type}`);
      if (empty) empty.style.display = visible === 0 ? 'block' : 'none';
      if (table) table.style.display = visible === 0 ? 'none' : 'table';
    }

    function switchLeaveModalTab(tab) {
      currentTab = tab;

      document.querySelectorAll('.leave-tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });

      document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === `panel-${tab}`);
      });
    }

    async function fetchLeaves() {
      const spApproved = document.getElementById('spinner-approved');
      const spPending = document.getElementById('spinner-pending');
      const tbApproved = document.getElementById('table-approved');
      const tbPending = document.getElementById('table-pending');
      const emApproved = document.getElementById('empty-approved');
      const emPending = document.getElementById('empty-pending');

      if (spApproved) spApproved.style.display = 'block';
      if (spPending) spPending.style.display = 'block';
      if (tbApproved) tbApproved.style.display = 'none';
      if (tbPending) tbPending.style.display = 'none';
      if (emApproved) emApproved.style.display = 'none';
      if (emPending) emPending.style.display = 'none';

      try {
        const res = await fetch(API_URL + '?_t=' + Date.now());
        if (!res.ok) throw new Error('API error: ' + res.status);
        allData = await res.json();
      } catch (err) {
        console.warn("fetchLeaves error:", err);
      }

      const approvedList = (allData && Array.isArray(allData.approved)) ? allData.approved : [];
      const pendingList = (allData && Array.isArray(allData.pending)) ? allData.pending : [];

      const appCntEl = document.getElementById('approved-count');
      const pendCntEl = document.getElementById('pending-count');
      if (appCntEl) appCntEl.textContent = approvedList.length;
      if (pendCntEl) pendCntEl.textContent = pendingList.length;

      const total = approvedList.length + pendingList.length;
      const approvedBtn = document.getElementById('tab-btn-approved');
      const subTitleEl = document.getElementById('modalSubtitle');
      if (subTitleEl) {
        if (approvedBtn && approvedBtn.style.display === 'none') {
          subTitleEl.textContent = `${pendingList.length} pending records • Company`;
        } else {
          subTitleEl.textContent = `${total} total records • Company`;
        }
      }

      const oncoBdg = document.getElementById('oncoPendingLeaveBadge');
      if (oncoBdg) {
        oncoBdg.textContent = pendingList.length;
        oncoBdg.style.display = pendingList.length > 0 ? 'inline-flex' : 'none';
      }

      const metaEl = document.getElementById('footer-meta');
      if (metaEl) {
        metaEl.innerHTML = `Last synced <strong>${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</strong>`;
      }

      // Render the currently active tab first so UI responds immediately
      if (currentTab === 'pending') {
        try { renderSanctionLeaveTable('pending', pendingList); } catch (e) { console.error('Error rendering pending table:', e); }
        try { renderSanctionLeaveTable('approved', approvedList); } catch (e) { console.error('Error rendering approved table:', e); }
      } else {
        try { renderSanctionLeaveTable('approved', approvedList); } catch (e) { console.error('Error rendering approved table:', e); }
        try { renderSanctionLeaveTable('pending', pendingList); } catch (e) { console.error('Error rendering pending table:', e); }
      }
    }

    let isOnlyPendingMode = false;

    function openLeaveModal(defaultTab = 'approved', onlyPending = false) {
      isOnlyPendingMode = onlyPending;
      const el = document.getElementById('leaveModal');
      if (!el) return;

      if (window.bootstrap && bootstrap.Modal) {
        modalInstance = bootstrap.Modal.getOrCreateInstance(el, { backdrop: true });
      }

      const approvedBtn = document.getElementById('tab-btn-approved');
      const pendingBtn = document.getElementById('tab-btn-pending');
      const modalTitle = document.getElementById('leaveModalLabel');

      if (onlyPending) {
        if (approvedBtn) approvedBtn.style.display = 'none';
        if (modalTitle) modalTitle.textContent = 'All Pending Leaves';
        currentTab = 'pending';
      } else {
        if (approvedBtn) approvedBtn.style.display = '';
        if (modalTitle) modalTitle.textContent = 'Leave Status';
        currentTab = defaultTab;
      }

      if (modalInstance) modalInstance.show();
      switchLeaveModalTab(currentTab);
      fetchLeaves();
    }

    function openAllPendingLeavesModal() {
      openLeaveModal('pending', true);
    }
    window.openLeaveModal = openLeaveModal;
    window.openAllPendingLeavesModal = openAllPendingLeavesModal;

    function closeLeaveModal() {
      if (modalInstance) modalInstance.hide();
      const approvedBtn = document.getElementById('tab-btn-approved');
      if (approvedBtn) approvedBtn.style.display = '';
      const modalTitle = document.getElementById('leaveModalLabel');
      if (modalTitle) modalTitle.textContent = 'Leave Status';
    }

    function exportLeaveModalCSV() {
      const rows = allData[currentTab];
      if (!rows || rows.length === 0) {
        alert('No data to export.');
        return;
      }

      const headers = Object.keys(rows[0]);
      const csvContent = [
        headers.join(','),
        ...rows.map(row => headers.map(h => `"${row[h] ?? ''}"`).join(','))
      ].join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${currentTab}_leaves_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function downloadLeaveCertificate(get_leave_id) {
      window.open(`/apply_leave/download_certificate/${get_leave_id}?t=${Date.now()}`, '_blank');
    }

    // Global aliases for convenience
    window.renderSanctionLeaveTable = renderSanctionLeaveTable;
    window.filterLeaveModalTable = filterLeaveModalTable;
    window.switchLeaveModalTab = switchLeaveModalTab;
    window.exportLeaveModalCSV = exportLeaveModalCSV;
    window.downloadLeaveCertificate = downloadLeaveCertificate;
    window.closeLeaveModal = closeLeaveModal;
  </script>
