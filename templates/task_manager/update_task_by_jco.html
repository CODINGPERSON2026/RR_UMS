<!-- Main Tasks List Modal -->
<div class="modal fade" id="taskModal" tabindex="-1" aria-labelledby="taskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content shadow-lg border-0">
        <div class="modal-header bg-gradient-primary text-white">
          <h5 class="modal-title fw-bold" id="taskModalLabel">
            <i class="bi bi-list-task me-2"></i>My Assigned Tasks
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-primary">
                <tr>
                  <th class="fw-semibold">Task Name</th>
                  <th class="fw-semibold">Description</th>
                  <th class="fw-semibold">Priority</th>
                  <th class="fw-semibold">Due Date</th>
                  <th class="fw-semibold text-center">Action</th>
                </tr>
              </thead>
              <tbody id="taskModalBody"></tbody>
            </table>
          </div>
          <div class="text-center text-muted mt-3" id="noTasksMessage" style="display: none;">
            <em>No tasks assigned yet.</em>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Custom Styling for Premium Modal Aesthetics -->
  <style>
    #editTaskModal .modal-content {
      border-radius: 16px;
      border: none;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15) !important;
    }
    #editTaskModal .form-label {
      color: #475569;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }
    #editTaskModal .form-select, #editTaskModal .form-control {
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      padding: 10px 14px;
      transition: all 0.2s ease-in-out;
    }
    #editTaskModal .form-select:focus, #editTaskModal .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.12);
      background-color: #f8fafc;
    }
    #editTaskModal .form-range {
      height: 6px;
      border-radius: 999px;
    }
    #editTaskModal .form-range::-webkit-slider-thumb {
      background: #3b82f6;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.3);
      width: 18px;
      height: 18px;
      transition: transform 0.1s ease;
      cursor: pointer;
    }
    #editTaskModal .form-range::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }
    #editTaskModal .btn {
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 600;
      transition: all 0.2s;
    }
    #editTaskModal .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
    }
    #editTaskModal .btn-success:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }
    #editTaskModal .progress {
      border-radius: 999px;
      background-color: #f1f5f9;
      overflow: hidden;
    }
  </style>

  <!-- Edit Task Modal -->
  <div class="modal fade" id="editTaskModal" tabindex="-1" aria-labelledby="editTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow">
        <div class="modal-header bg-gradient-primary text-white border-0 py-3" style="background: linear-gradient(135deg, #0d6efd, #0a58ca);">
          <h5 class="modal-title fw-bold d-flex align-items-center" id="editTaskModalLabel">
            <i class="bi bi-pencil-square me-2"></i>Update Task Progress
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form>
            <div class="mb-3">
              <label class="form-label fw-semibold">Task Status</label>
              <select class="form-select" id="editTaskStatus">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
  
            <div class="mb-3">
              <label class="form-label fw-semibold">Remarks</label>
              <textarea class="form-control" id="editRemarks" rows="3" placeholder="Type new remark here to append..."></textarea>
            </div>
  
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label fw-semibold">Range Status</label>
                <span class="badge bg-light text-primary fw-bold fs-6 border" id="rangeValue">0%</span>
              </div>
              <input type="range" class="form-range mt-2" min="0" max="100" value="0" id="editRangeStatus">
              <div class="progress mt-2" style="height: 8px;">
                <div class="progress-bar" id="rangeProgressBar" style="width: 0%;"></div>
              </div>
            </div>
  
            <div class="text-end pt-2 border-top">
              <button type="button" class="btn btn-light border me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-success d-inline-flex align-items-center" id="saveTaskBtn">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    let currentTaskId = null;
    let taskModalInstance = null; // To control the main modal
  
    const taskCard = document.getElementById('task-assigned');
    if(taskCard) {
      taskCard.addEventListener('click', () => {
        fetch('/task_manager/get_my_tasks')
          .then(res => {
            if (!res.ok) throw new Error('Network error');
            return res.json();
          })
          .then(data => {
            const tbody = document.getElementById('taskModalBody');
            const noTasksMsg = document.getElementById('noTasksMessage');
            tbody.innerHTML = '';
    
            if (data.tasks.length === 0) {
              noTasksMsg.style.display = 'block';
            } else {
              noTasksMsg.style.display = 'none';
            }
    
            data.tasks.forEach(task => {
              const row = document.createElement('tr');
              
              const updateBtn = document.createElement('button');
              updateBtn.className = 'btn btn-sm btn-primary shadow-sm';
              updateBtn.innerHTML = '<i class="bi bi-pencil-square me-1"></i> Update';
              updateBtn.addEventListener('click', () => {
                openEditModal(task.id, task.task_status || 'Pending', task.remarks || '', task.range_status || 0);
              });
              
              row.innerHTML = `
                <td class="fw-medium">${escapeHtml(task.task_name)}</td>
                <td class="text-muted small">${escapeHtml(task.description || '-')}</td>
                <td>
                  <span class="badge bg-${task.priority === 'High' ? 'danger' : task.priority === 'Medium' ? 'warning' : 'info'}">
                    ${task.priority || 'Low'}
                  </span>
                </td>
                <td class="text-nowrap">${task.due_date || '-'}</td>
                <td class="text-center action-td"></td>
              `;
              
              row.querySelector('.action-td').appendChild(updateBtn);
              tbody.appendChild(row);
            });
    
            // Show main modal and store instance
            const modalElement = document.getElementById('taskModal');
            taskModalInstance = new bootstrap.Modal(modalElement);
            taskModalInstance.show();
          })
          .catch(err => {
            alert('Failed to load tasks: ' + err.message);
          });
      });
    }

    function updateProgressBar(val) {
      const bar = document.getElementById('rangeProgressBar');
      if (!bar) return;
      bar.style.width = val + '%';
      
      // Dynamic color coding based on progress percentage
      bar.className = 'progress-bar'; // reset class names
      const valNum = parseInt(val);
      if (valNum < 35) {
        bar.classList.add('bg-danger');
      } else if (valNum < 70) {
        bar.classList.add('bg-warning');
      } else {
        bar.classList.add('bg-success');
      }
    }

    function openEditModal(taskId, status, remarks, rangeValue) {
      currentTaskId = taskId;
  
      // Populate form
      document.getElementById('editTaskStatus').value = status;
      document.getElementById('editRemarks').value = ""; // Always clear new remark box
      document.getElementById('editRangeStatus').value = rangeValue;
      document.getElementById('rangeValue').textContent = rangeValue + '%';
      
      updateProgressBar(rangeValue);
  
      // Live slider update
      const slider = document.getElementById('editRangeStatus');
      slider.oninput = function() {
        document.getElementById('rangeValue').textContent = this.value + '%';
        updateProgressBar(this.value);
      };
  
      // IMPORTANT: Hide the main modal before showing edit modal
      if (taskModalInstance) {
        taskModalInstance.hide();
      }
  
      // Show edit modal
      const editModal = new bootstrap.Modal(document.getElementById('editTaskModal'));
      editModal.show();
    }
  
    // Save changes
    document.getElementById('saveTaskBtn').addEventListener('click', async () => {
      if (!currentTaskId) return;
  
      const status = document.getElementById('editTaskStatus').value;
      const newRemark = document.getElementById('editRemarks').value.trim();
      const range = document.getElementById('editRangeStatus').value;
  
      const btn = document.getElementById('saveTaskBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Saving...';
      btn.disabled = true;

      try {
        const success = await updateTask(currentTaskId, status, newRemark, range);
        if (success) {
          btn.innerHTML = '<i class="bi bi-check-circle-fill me-2"></i>Saved!';
          btn.classList.replace('btn-success', 'btn-info');
          
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.replace('btn-info', 'btn-success');
            btn.disabled = false;
            
            // Hide Edit Modal
            const editModalEl = document.getElementById('editTaskModal');
            const editModalInst = bootstrap.Modal.getInstance(editModalEl) || new bootstrap.Modal(editModalEl);
            editModalInst.hide();
            
            // Refresh parent task list modal
            if (taskCard) taskCard.click();
          }, 1000);
        } else {
          alert('Failed to update task.');
          btn.innerHTML = originalText;
          btn.disabled = false;
        }
      } catch (err) {
        alert('An error occurred while saving.');
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    });
  
    async function updateTask(taskId, status, newRemark, range) {
      try {
        const res = await fetch('/task_manager/update_task', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            id: taskId, 
            task_status: status, 
            new_remark: newRemark, 
            range_status: range 
          })
        });
        const data = await res.json();
        return data.success;
      } catch (err) {
        console.error('Update failed:', err);
        return false;
      }
    }
  
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text || '';
      return div.innerHTML;
    }
  
    function escapeHtmlForAttr(text) {
      return (text || '').replace(/'/g, '&#39;').replace(/"/g, '&quot;');
    }
  </script>
